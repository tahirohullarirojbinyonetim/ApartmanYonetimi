<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-soft:#eef2f9;--primary:#2a5c9e;--primary-light:#e6edf9;
  --primary-dark:#1e3f6e;--text:#1e293b;--text-soft:#64748b;--border:#dbe3ee;
  --success:#2e7d32;--success-bg:#e8f5e9;--danger:#c62828;--danger-bg:#ffebee;
  --warning:#b26a00;--warning-bg:#fff8e1;--info:#1565c0;--info-bg:#e3f2fd;
  --shadow:0 2px 8px rgba(0,0,0,.05);--radius:14px;--radius-sm:10px;
  --wa:#25d366;
}
body{background:var(--bg);color:var(--text);padding-bottom:80px;font-size:14.5px;line-height:1.5}

.header{background:linear-gradient(135deg,#2a5c9e,#1e3f6e);color:#fff;
  padding:20px 16px 22px;border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.header h1{font-size:1.05rem;font-weight:700;letter-spacing:.3px}
.header .sub{font-size:.78rem;opacity:.85;margin-top:2px}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.app{max-width:640px;margin:0 auto;padding:14px 12px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;
  margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:.95rem;font-weight:700;color:var(--primary-dark);
  display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-title .badge-cnt{background:var(--primary-light);color:var(--primary);
  font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:600}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--radius-sm);padding:12px;
  box-shadow:var(--shadow);border:1px solid var(--border)}
.stat .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;
  color:var(--text-soft);margin-bottom:4px;font-weight:600}
.stat .val{font-size:1.25rem;font-weight:800;color:var(--primary-dark)}
.stat.green{border-left:4px solid var(--success)}
.stat.red{border-left:4px solid var(--danger)}
.stat.yellow{border-left:4px solid var(--warning)}
.stat.blue{border-left:4px solid var(--info)}
.stat.teal{border-left:4px solid #00897b}

.li{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
.li:last-child{border-bottom:none}
.li-t{font-weight:600;font-size:.88rem}
.li-d{font-size:.74rem;color:var(--text-soft);margin-top:2px}
.li-v{font-weight:700;color:var(--primary-dark);white-space:nowrap;font-size:.88rem}
.li-v.green{color:var(--success)}
.li-v.red{color:var(--danger)}
.li-v.teal{color:#00897b}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:30px;font-weight:600;font-size:.85rem;
  border:none;cursor:pointer;transition:.15s;background:var(--surface-soft);color:var(--text)}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-wa{background:var(--wa);color:#fff}
.btn-teal{background:#00897b;color:#fff}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:.75rem;border-radius:20px}
.btn-xs{padding:4px 9px;font-size:.7rem;border-radius:16px}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff;border:none;padding:7px 13px;
  border-radius:20px;font-size:.78rem;cursor:pointer;font-weight:600}

.fg{margin-bottom:10px}
.fg label{display:block;font-size:.75rem;font-weight:600;color:var(--text-soft);margin-bottom:4px}
.fc{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:#fff;font-size:.9rem;font-family:inherit}
.fc:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(42,92,158,.1)}
textarea.fc{resize:vertical;min-height:80px}

.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:6px 2px max(8px,env(safe-area-inset-bottom));z-index:50;max-width:640px;margin:0 auto}
.bnav button{background:none;border:none;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:.62rem;color:var(--text-soft);
  padding:5px 2px;flex:1;cursor:pointer;font-weight:600}
.bnav button .ic{font-size:1.15rem}
.bnav button.active{color:var(--primary)}

.apt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.apt-btn{background:var(--surface-soft);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 2px;text-align:center;
  font-weight:700;font-size:.8rem;cursor:pointer;color:var(--text)}
.apt-btn.paid{background:var(--success-bg);border-color:#a5d6a7;color:#1b5e20}
.apt-btn.unpaid{background:var(--danger-bg);border-color:#ef9a9a;color:#b71c1c}
.apt-btn.partial{background:var(--warning-bg);border-color:#ffcc80;color:#e65100}
.apt-btn.muaf{background:#e9edf3;border-color:#cbd5e1;color:#5b6b7f}
.apt-btn.alacakli{background:#e0f2f1;border-color:#80cbc4;color:#00695c}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;
  border:1px solid var(--border);position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.72rem;background:#fff}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid #f1f5f9;white-space:nowrap}
th{background:#f8fafc;color:var(--text-soft);font-weight:700;font-size:.66rem;text-transform:uppercase}
td.left,th.left{text-align:left;padding-left:10px}
.sticky-col-1{position:sticky;left:0;background:#fff;z-index:3;min-width:52px}
.sticky-col-2{position:sticky;left:52px;background:#fff;z-index:3;min-width:110px;
  box-shadow:2px 0 4px rgba(0,0,0,.06)}
th.sticky-col-1,th.sticky-col-2{background:#f8fafc;z-index:4}
tr:last-child td{border-bottom:none}
.cell-paid{background:var(--success-bg);color:var(--success);font-weight:700}
.cell-unpaid{background:var(--danger-bg);color:var(--danger);font-weight:700}
.cell-old{background:#e9edf3;color:#5b6b7f;font-weight:600;font-style:italic}
.cell-muaf{background:var(--info-bg);color:var(--info);font-weight:700}
.cell-empty{color:#cbd5e1}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:30px;background:var(--surface-soft);
  font-size:.78rem;font-weight:600;white-space:nowrap;cursor:pointer}
.tab.active{background:var(--primary);color:#fff}

.mov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;
  align-items:flex-end;justify-content:center;z-index:200}
.mov.open{display:flex}
.mod{background:#fff;width:100%;max-width:640px;border-top-left-radius:22px;
  border-top-right-radius:22px;padding:20px 16px;max-height:92vh;overflow-y:auto;position:relative}
.mod .close{position:absolute;top:14px;right:14px;background:#f1f5f9;border:none;
  width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer;font-weight:700;color:#64748b;z-index:10}
.mod h2{font-size:1.05rem;margin-bottom:14px;color:var(--primary-dark);padding-right:40px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--text-soft);font-size:.78rem}
.sec-title{font-size:.78rem;font-weight:700;color:var(--primary-dark);
  text-transform:uppercase;letter-spacing:.04em;margin:6px 0 8px}
.divider{height:1px;background:var(--border);margin:12px 0}
.empty{text-align:center;padding:26px 16px;color:var(--text-soft);font-size:.85rem}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-soft);
  color:var(--text-soft);font-size:.68rem;font-weight:600;margin-right:4px}

.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-item{background:#fff;border-radius:var(--radius-sm);padding:14px 10px;
  text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);
  cursor:pointer;font-size:.8rem;font-weight:600;display:flex;flex-direction:column;
  align-items:center;gap:6px}
.more-item .ic{font-size:1.4rem;color:var(--primary)}

.kalem-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.kalem-row input{flex:1}
.kalem-row .btn-sm{padding:8px 10px;font-size:.75rem;flex-shrink:0}

.apt-check{display:flex;align-items:center;gap:6px;padding:6px 8px;
  border:1px solid var(--border);border-radius:8px;background:#fff;font-size:.78rem;
  cursor:pointer;user-select:none}
.apt-check.on{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.apt-check input{margin:0}
.apt-check-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}

.proj-item{background:var(--surface-soft);border-radius:var(--radius-sm);
  padding:12px;margin-bottom:10px;border-left:4px solid var(--primary)}
.proj-item h4{font-size:.9rem;color:var(--primary-dark);margin-bottom:4px}
.proj-item .meta{font-size:.75rem;color:var(--text-soft);margin-bottom:8px}
.proj-item .bar{height:8px;background:#dbe3ee;border-radius:10px;overflow:hidden;margin:6px 0}
.proj-item .bar-fill{height:100%;background:var(--success);border-radius:10px}

.odemeli-list{display:flex;flex-direction:column;gap:6px}
.odeme-satir{display:flex;align-items:center;gap:6px;padding:8px 10px;
  border:1px solid var(--border);border-radius:10px;background:#fff}
.odeme-satir.odendi{background:var(--success-bg);border-color:#a5d6a7}
.odeme-satir.kismi{background:var(--warning-bg);border-color:#ffcc80}
.odeme-satir.borc{background:var(--danger-bg);border-color:#ef9a9a}
.odeme-satir.alacakli{background:#e0f2f1;border-color:#80cbc4}
.odeme-satir .ds-kod{font-weight:800;font-size:.82rem;min-width:38px;color:var(--primary-dark)}
.odeme-satir .ds-isim{flex:1;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.odeme-satir .ds-tutar{font-size:.7rem;font-weight:700;white-space:nowrap;text-align:right}
.odeme-satir .ds-btn{flex-shrink:0;display:flex;flex-direction:column;gap:3px}

.bildirim-satir{display:flex;align-items:center;gap:8px;padding:10px;
  border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:6px}
.bildirim-satir.no-phone{opacity:.55;background:#f8fafc}
.bildirim-satir .bs-check{flex-shrink:0}
.bildirim-satir .bs-info{flex:1;min-width:0}
.bildirim-satir .bs-kod{font-weight:800;color:var(--primary-dark);font-size:.82rem}
.bildirim-satir .bs-tel{font-size:.7rem;color:var(--text-soft)}
.bildirim-satir .bs-borc{font-weight:700;font-size:.78rem;color:var(--danger);text-align:right;white-space:nowrap}
.bildirim-satir .bs-borc.ok{color:var(--success)}

.hidden{display:none!important}
.uyari{background:#fff8e1;border:1px solid #ffe082;color:#8a6d00;
  padding:10px 12px;border-radius:10px;font-size:.78rem;margin-bottom:10px}
.uyari.teal{background:#e0f2f1;border-color:#80cbc4;color:#00695c}
.uyari.red{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}
.uyari.green{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}

#syncBar{position:fixed;top:0;left:0;right:0;height:3px;background:transparent;z-index:999;transition:background .3s}
#syncBar.saving{background:linear-gradient(90deg,#ffc107,#ff9800,#ffc107);background-size:200% 100%;animation:slide 1s linear infinite}
#syncBar.saved{background:#4caf50}
#syncBar.error{background:#f44336}
@keyframes slide{0%{background-position:0 0}100%{background-position:200% 0}}
#syncStatus{position:fixed;top:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;
  padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600;z-index:998;
  opacity:0;transition:opacity .3s}
#syncStatus.show{opacity:1}
</style>
</head>

/* ============ YARDIMCILAR ============ */
function fmtMoney(n){
  const v = Number(n)||0;
  return v.toLocaleString('tr-TR',{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2})+' ₺';
}
function fmtDate(s){ if(!s) return '-'; const d=new Date(s); if(isNaN(d))return s;
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function aptKey(a){ return a.blok+a.daire; }
function getApt(k){ return db.apartments.find(a=>aptKey(a)===k); }
function tumDaireKodlari(){ return db.apartments.map(a=>aptKey(a)); }

function hucreTutar(v){
  if(v === 'MUAF' || v === 'ÖDENMEDİ' || !v) return 0;
  if(typeof v === 'number') return v;
  const n = Number(v);
  if(!isNaN(n) && n > 0) return n;
  return 0;
}
function aidatOdenen(k){
  const row = db.aidat[k] || [];
  return row.reduce((s,v)=>s+hucreTutar(v), 0);
}
function aidatKalanFazlaOncesi(k){
  const row = db.aidat[k] || [];
  if(row.some(v=>v==='MUAF')) return 0;
  return Math.max(0, TOPLAM_BEKLE - aidatOdenen(k));
}
function fazlaOdemesi(k){ return db.fazlaOdemeler[k] || 0; }
function aidatKalan(k){
  const hesaplanan = aidatKalanFazlaOncesi(k);
  const fazla = fazlaOdemesi(k);
  return Math.max(0, hesaplanan - fazla);
}
function aidatDurum(k){
  const row = db.aidat[k] || [];
  if(row.some(v=>v==='MUAF')) return 'muaf';
  const fazla = db.fazlaOdemeler[k] || 0;
  if(fazla > 0 && aidatKalanFazlaOncesi(k) === 0) return 'alacakli';
  const kalan = aidatKalan(k);
  if(kalan === 0) return 'paid';
  if(aidatOdenen(k) > 0) return 'partial';
  return 'unpaid';
}
function demirbasOdenen(k){ return (db.demirbas[k]&&db.demirbas[k].odenen)||0; }
function demirbasKalan(k){
  const d = db.demirbas[k]; if(!d) return 0;
  return Math.max(0, d.nefestenKalan - d.odenen);
}
function demirbasToplamOdenen(k){
  let t = demirbasOdenen(k);
  db.demirbasProjeler.forEach(p=>{ t += (p.odemeler[k]||0); });
  return t;
}
function demirbasToplamBorc(k){
  let t = 0;
  const d = db.demirbas[k];
  if(d) t += Math.max(0, d.nefestenKalan - d.odenen);
  db.demirbasProjeler.forEach(p=>{
    if(p.secilenDaireler.indexOf(k) > -1){
      const od = p.odemeler[k]||0;
      t += Math.max(0, p.daireBasi - od);
    }
  });
  return t;
}
function toplamAidatTahsilat(){ let t=0; Object.keys(db.aidat).forEach(k=>t+=aidatOdenen(k)); return t; }
function toplamDemirbasTahsilat(){
  let t = 0;
  Object.keys(db.demirbas).forEach(k=>t+=demirbasOdenen(k));
  db.demirbasProjeler.forEach(p=>{
    Object.keys(p.odemeler).forEach(k=>t+=p.odemeler[k]);
  });
  return t;
}
function toplamGider(){ return db.giderler.reduce((s,g)=>s+(Number(g.tutar)||0),0); }
function kasaBaki(){
  const bas = db.kasaBaslangic || 0;
  return bas + toplamAidatTahsilat() + toplamDemirbasTahsilat() - toplamGider();
}
function toplamAidatBorc(){ let t=0; db.apartments.forEach(a=>t+=aidatKalan(aptKey(a))); return t; }
function toplamDemirbasBorc(){ let t=0; db.apartments.forEach(a=>t+=demirbasToplamBorc(aptKey(a))); return t; }
function toplamFazla(){ let t=0; Object.keys(db.fazlaOdemeler).forEach(k=>t+=db.fazlaOdemeler[k]); return t; }

function telToWhatsApp(tel){
  if(!tel) return '';
  const temiz = String(tel).replace(/\D/g,'');
  if(!temiz) return '';
  if(temiz.startsWith('90') && temiz.length >= 12) return temiz;
  if(temiz.startsWith('0')) return '90'+temiz.slice(1);
  if(temiz.length === 10) return '90'+temiz;
  return temiz;
}
function telGecerliMi(tel){
  if(!tel) return false;
  const t = String(tel).trim();
  if(t === '' || t === 'BİLİNMİYOR' || t === 'BILINMIYOR') return false;
  const sadece = t.replace(/\D/g,'');
  return sadece.length >= 10;
}

function sablonDoldur(sablon, daireKodu){
  const a = getApt(daireKodu);
  const aidatBorc = aidatKalan(daireKodu);
  const demBorc = demirbasToplamBorc(daireKodu);
  const toplam = aidatBorc + demBorc;
  const fazla = fazlaOdemesi(daireKodu);
  let alacakSatir = '';
  if(fazla > 0){
    alacakSatir = "\n✅ Alacaklı olduğunuz tutar: " + fmtMoney(fazla) + " (ödemelerinizden düşebilirsiniz)\n";
  }
  return sablon
    .split('{ISIM}').join(a?a.isim||'Sakin':'Sakin')
    .split('{DAIRE}').join(daireKodu)
    .split('{AIDAT_ODENEN}').join(fmtMoney(aidatOdenen(daireKodu)))
    .split('{AIDAT_BORC}').join(fmtMoney(aidatBorc))
    .split('{DEMIRBAS_ODENEN}').join(fmtMoney(demirbasToplamOdenen(daireKodu)))
    .split('{DEMIRBAS_BORC}').join(fmtMoney(demBorc))
    .split('{TOPLAM_BORC}').join(fmtMoney(toplam))
    .split('{ALACAK}').join(fmtMoney(fazla))
    .split('{ALACAK_SATIR}').join(alacakSatir)
    .split('{SITE_ADI}').join('Tahiroğulları Rojbin Sitesi');
}

function whatsappGonder(daireKodu, mesaj){
  const a = getApt(daireKodu);
  if(!a) return false;
  if(!telGecerliMi(a.telefon)) return false;
  const tel = telToWhatsApp(a.telefon);
  const url = 'https://wa.me/'+tel+'?text='+encodeURIComponent(mesaj);
  window.open(url, '_blank');
  db.bildirimGecmisi.push({
    id: Date.now()+Math.random(),
    daire: daireKodu, tel: tel,
    tarih: new Date().toISOString(),
    tip: 'whatsapp'
  });
  saveDB();
  return true;
}
function sonBildirim(daireKodu){
  const liste = db.bildirimGecmisi.filter(b=>b.daire===daireKodu);
  if(!liste.length) return null;
  return liste[liste.length-1];
}
function sonBildirimKisa(daireKodu){
  const s = sonBildirim(daireKodu);
  if(!s) return '';
  const d = new Date(s.tarih);
  const gun = Math.floor((Date.now() - d.getTime())/(1000*60*60*24));
  if(gun === 0) return 'bugün';
  if(gun === 1) return 'dün';
  return gun+' gün önce';
}

/* ============ FIREBASE - DİNAMİK YÜKLEME ============ */
let _fbReady = false;
let _fbSaveTimer = null;
let _fs = null, _doc = null, _setDoc = null, _getDoc = null, _onSnapshot = null;

function setSyncStatus(status, msg){
  const bar = document.getElementById('syncBar');
  const st = document.getElementById('syncStatus');
  if(!bar || !st) return;
  bar.className = '';
  if(status === 'saving'){
    bar.classList.add('saving');
    st.textContent = msg||'💾 Kaydediliyor...';
    st.classList.add('show');
  } else if(status === 'saved'){
    bar.classList.add('saved');
    st.textContent = '✓ Buluta kaydedildi';
    st.classList.add('show');
    setTimeout(function(){ st.classList.remove('show'); }, 1500);
    setTimeout(function(){ bar.className=''; }, 1500);
  } else if(status === 'error'){
    bar.classList.add('error');
    st.textContent = '⚠️ '+(msg||'Bağlantı hatası');
    st.classList.add('show');
  }
}

function saveToCloud(){
  if(!_fbReady || !_setDoc) return;
  setSyncStatus('saving');
  clearTimeout(_fbSaveTimer);
  _fbSaveTimer = setTimeout(async function(){
    try{
      await _setDoc(_doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC), JSON.parse(JSON.stringify(db)));
      setSyncStatus('saved');
    }catch(e){
      console.error('Firebase save error:', e);
      setSyncStatus('error', e.message);
    }
  }, 600);
}

function saveDB(){
  window.db = db;
  saveLocalDB(db);
  saveToCloud();
}

async function loadFromCloud(){
  if(!_getDoc) return false;
  try{
    const ref = _doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC);
    const snap = await _getDoc(ref);
    if(snap.exists()){
      const cloudData = snap.data();
      if(cloudData && cloudData.apartments && cloudData.apartments.length){
        db = cloudData;
        if(!db.fazlaOdemeler) db.fazlaOdemeler = {};
        if(db.kasaBaslangic === undefined) db.kasaBaslangic = KASA_BASLANGIC;
        if(!db.sablonlar) db.sablonlar = JSON.parse(JSON.stringify(DEFAULT_SABLONLAR));
        if(!db.bildirimGecmisi) db.bildirimGecmisi = [];
        saveLocalDB(db);
        window.db = db;
        console.log('✓ Firebase\'den yüklendi');
      } else {
        await _setDoc(ref, JSON.parse(JSON.stringify(db)));
      }
    } else {
      await _setDoc(ref, JSON.parse(JSON.stringify(db)));
    }
    return true;
  }catch(e){
    console.error('Firebase load error:', e);
    return false;
  }
}

function startRealtimeSync(){
  if(!_onSnapshot) return;
  try{
    const ref = _doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC);
    let first = true;
    _onSnapshot(ref, function(snap){
      if(first){ first = false; return; }
      if(snap.exists()){
        const cloudData = snap.data();
        const currentJson = JSON.stringify(db);
        const cloudJson = JSON.stringify(cloudData);
        if(currentJson !== cloudJson){
          db = cloudData;
          saveLocalDB(db);
          window.db = db;
          render();
          console.log('⟳ Buluttan güncelleme alındı');
        }
      }
    });
  }catch(e){ console.warn('Realtime sync error:', e); }
}

function aptDetay(k){
  const a = getApt(k);
  if(!a) return;
  const aidatRow = db.aidat[k] || [];
  const demir = db.demirbas[k] || {nefestenKalan:4250, odenen:0};
  const projeler = db.demirbasProjeler.filter(p=>p.secilenDaireler.indexOf(k)>-1);
  const telVar = telGecerliMi(a.telefon);
  const son = sonBildirimKisa(k);
  const fazla = fazlaOdemesi(k);

  let body = '<h2>'+a.blok+a.daire+' - Daire Detayı</h2>';

  if(fazla > 0){
    body += '<div class="uyari teal">💚 <b>Bu dairenin fazla ödemesi var: '+fmtMoney(fazla)+'</b><br>Aidat ödemesinden düşmek için aşağıdaki butonu kullanabilirsin.</div>';
  }

  body += '<div class="uyari '+(telVar?'green':'red')+'"><b>📱 WhatsApp:</b> '+(telVar?'Telefon kayıtlı ✓':'Telefon kayıtlı değil — aşağıdan ekle')+(son?'<br>Son gönderim: '+son:'')+'</div>';

  body += '<div class="sec-title">👤 Sakin Bilgileri</div>'
    + '<div class="fg"><label>Oturan İsim</label><input class="fc" id="f_isim" value="'+(a.isim||'')+'"></div>'
    + '<div class="fg"><label>Telefon (WhatsApp)</label><input class="fc" id="f_telefon" value="'+(a.telefon||'')+'" placeholder="05xx xxx xx xx"></div>'
    + '<div class="fg"><label>Araç Plaka</label><input class="fc" id="f_plaka" value="'+(a.plaka||'')+'"></div>'
    + '<div class="fg"><label>Ev Sahibi İsim</label><input class="fc" id="f_evsahibi" value="'+(a.evsahibi||'')+'"></div>'
    + '<div class="fg"><label>Ev Sahibi Telefon</label><input class="fc" id="f_evtel" value="'+(a.evTel||'')+'"></div>';

  body += '<button class="btn btn-success btn-block" onclick="kaydetVeWhatsapp(\''+k+'\')">💾 Kaydet ve WhatsApp Bildirim Gönder</button>'
    + '<button class="btn btn-block" style="margin-top:6px" onclick="kaydetApt(\''+k+'\')">💾 Sadece Kaydet</button>';

  if(fazla > 0){
    body += '<div class="divider"></div>'
      + '<div class="sec-title">💚 Fazla Ödeme Yönetimi</div>'
      + '<div class="li"><div class="li-t">Mevcut fazla ödeme</div><div class="li-v teal">+'+fmtMoney(fazla)+'</div></div>'
      + '<div class="fg" style="margin-top:10px"><label>Aidat borcundan düşülecek tutar</label>'
      + '<input type="number" class="fc" id="f_fazlaDus" value="'+Math.min(fazla, aidatKalanFazlaOncesi(k))+'">'
      + '<div class="muted" style="margin-top:4px">Kalan borç (fazla öncesi): '+fmtMoney(aidatKalanFazlaOncesi(k))+'</div></div>'
      + '<button class="btn btn-teal btn-block" onclick="fazlaDus(\''+k+'\')">💚 Aidattan Düş</button>';
  }

  body += '<div class="divider"></div>'
    + '<div class="sec-title">💰 Aidat Özeti</div>'
    + '<div class="li"><div class="li-t">Ödenen</div><div class="li-v green">'+fmtMoney(aidatOdenen(k))+'</div></div>';
  if(fazla>0) body += '<div class="li"><div class="li-t">Fazla ödeme (alacak)</div><div class="li-v teal">+'+fmtMoney(fazla)+'</div></div>';
  body += '<div class="li"><div class="li-t">Kalan Borç</div><div class="li-v red">'+fmtMoney(aidatKalan(k))+'</div></div>';

  body += '<div class="sec-title">🏗️ Demirbaş (Excel)</div>'
    + '<div class="li"><div class="li-t">Nefesten Kalan</div><div class="li-v">'+fmtMoney(demir.nefestenKalan)+'</div></div>'
    + '<div class="li"><div class="li-t">Ödenen</div><div class="li-v green">'+fmtMoney(demir.odenen)+'</div></div>'
    + '<div class="li"><div class="li-t">Kalan Borç</div><div class="li-v red">'+fmtMoney(Math.max(0, demir.nefestenKalan - demir.odenen))+'</div></div>';

  if(projeler.length){
    body += '<div class="sec-title">🆕 Yeni Demirbaş Projeleri</div>';
    projeler.forEach(function(p){
      const od = p.odemeler[k]||0;
      const kl = Math.max(0, p.daireBasi - od);
      body += '<div class="li"><div style="flex:1"><div class="li-t">'+p.baslik+'</div><div class="li-d">Daire başı: '+fmtMoney(p.daireBasi)+' · Ödenen: '+fmtMoney(od)+'</div></div><div class="li-v '+(kl>0?'red':'green')+'">'+(kl>0?fmtMoney(kl)+' borç':'Ödendi ✓')+'</div></div>';
    });
  }

  body += '<div class="divider"></div>'
    + '<div class="sec-title">📅 Aylık Aidat Düzenle</div>'
    + '<div class="tbl-wrap" style="margin-top:6px"><table style="min-width:auto">'
    + '<thead><tr><th class="left">Ay</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>';

  AY_ADLARI.forEach(function(ay, i){
    const v = aidatRow[i]||'';
    let cls='', lbl;
    if(v==='MUAF'){cls='cell-muaf';lbl='Muaf';}
    else if(v==='ÖDENMEDİ'){cls='cell-unpaid';lbl='Ödenmedi';}
    else if(v && String(v).indexOf('ESKİ')>-1){cls='cell-old';lbl=v;}
    else if(typeof v==='number' && v>0){cls='cell-paid';lbl=fmtMoney(v);}
    else if(v && !isNaN(Number(v)) && Number(v)>0){cls='cell-paid';lbl=fmtMoney(Number(v));}
    else {cls='cell-empty';lbl='—';}
    body += '<tr><td class="left">'+ay+'</td><td class="'+cls+'">'+lbl+'</td><td><button class="btn btn-sm btn-primary" onclick="editAidat(\''+k+'\','+i+')">Düzenle</button></td></tr>';
  });

  body += '</tbody></table></div>'
    + '<div class="fg" style="margin-top:12px"><label>Demirbaş (Excel) Ödenen Tutar</label>'
    + '<input type="number" class="fc" id="f_demirOdenen" value="'+(demir.odenen||0)+'"></div>'
    + '<button class="btn btn-primary btn-block" style="margin-top:14px" onclick="kaydetApt(\''+k+'\')">Kaydet</button>';

  openModal(body);
}

function kaydetApt(k){
  const a = getApt(k); if(!a) return;
  const t = document.getElementById('f_telefon').value.trim();
  a.isim = document.getElementById('f_isim').value.trim();
  a.telefon = t;
  a.plaka = document.getElementById('f_plaka').value.trim();
  a.evsahibi = document.getElementById('f_evsahibi').value.trim();
  a.evTel = document.getElementById('f_evtel').value.trim();
  const dO = document.getElementById('f_demirOdenen');
  if(dO){
    if(!db.demirbas[k]) db.demirbas[k] = {nefestenKalan:4250, odenen:0};
    db.demirbas[k].odenen = Number(dO.value)||0;
  }
  saveDB();
  closeModal();
  render();
  alert('Kaydedildi.' + (telGecerliMi(t) ? '\n\n📱 Bu daire artık WhatsApp bildirim listesinde.' : ''));
}
function kaydetVeWhatsapp(k){
  const a = getApt(k); if(!a) return;
  const t = document.getElementById('f_telefon').value.trim();
  if(!telGecerliMi(t)){ alert('Önce geçerli bir telefon numarası girin.'); return; }
  a.isim = document.getElementById('f_isim').value.trim();
  a.telefon = t;
  a.plaka = document.getElementById('f_plaka').value.trim();
  a.evsahibi = document.getElementById('f_evsahibi').value.trim();
  a.evTel = document.getElementById('f_evtel').value.trim();
  const dO = document.getElementById('f_demirOdenen');
  if(dO){
    if(!db.demirbas[k]) db.demirbas[k] = {nefestenKalan:4250, odenen:0};
    db.demirbas[k].odenen = Number(dO.value)||0;
  }
  saveDB();
  closeModal();
  render();
  setTimeout(function(){ bildirimGonder(k); }, 300);
}

function fazlaDus(k){
  const tutar = Number(document.getElementById('f_fazlaDus').value)||0;
  if(tutar <= 0){ alert('Tutar girin'); return; }
  const mevcut = fazlaOdemesi(k);
  if(tutar > mevcut){ alert('Fazla ödemeden fazla düşemezsiniz. Mevcut: '+fmtMoney(mevcut)); return; }
  db.fazlaOdemeler[k] = mevcut - tutar;
  if(db.fazlaOdemeler[k] <= 0) delete db.fazlaOdemeler[k];
  db.auditLogs.push({ts:new Date().toISOString(), user:'admin', action:k+' fazla ödemeden '+tutar+'₺ aidata düşüldü'});
  saveDB();
  closeModal();
  render();
  alert(fmtMoney(tutar) + ' fazla ödemeden düşüldü.');
}

function editAidat(k, ayIndex){
  const cur = (db.aidat[k]||[])[ayIndex];
  const curStr = (cur===undefined||cur===null)?'':String(cur);
  const isOdenmedi = curStr === 'ÖDENMEDİ';
  const isMuaf = curStr === 'MUAF';
  const isEski = curStr.indexOf('ESKİ') > -1;
  const sayisal = !isOdenmedi && !isMuaf && !isEski && curStr !== '' && !isNaN(Number(curStr)) && Number(curStr)>0;
  const fazla = fazlaOdemesi(k);

  let body = '<h2>'+k+' - '+AY_ADLARI[ayIndex]+' Ayı</h2>';

  if(fazla > 0){
    body += '<div class="uyari teal">💚 <b>Bu dairenin '+fmtMoney(fazla)+' fazla ödemesi var.</b><br>Normal aidat (750₺) - fazla = '+fmtMoney(Math.max(0, 750 - fazla))+' ₺</div>';
  }

  body += '<div class="sec-title">Ödeme Durumu</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">'
    + '<button class="btn '+(sayisal?'btn-success':'')+'" onclick="aidatSec(\'tutar\')">💵 Tutar Gir</button>'
    + '<button class="btn '+(isOdenmedi?'btn-danger':'')+'" onclick="aidatSec(\'odenmedi\')">❌ Ödenmedi</button>'
    + '<button class="btn '+(isMuaf?'btn-success':'')+'" onclick="aidatSec(\'muaf\')">⚪ Muaf</button>'
    + '<button class="btn '+(isEski?'btn-success':'')+'" onclick="aidatSec(\'eski\')">📜 Eski Sakin</button>'
    + '<button class="btn" style="grid-column:span 2" onclick="aidatSec(\'bos\')">🗑️ Boş (Sil)</button>'
    + '</div>'
    + '<div id="tutarWrap" class="fg" style="'+(sayisal?'':'display:none')+'">'
    + '<label>Ödenen Tutar (₺) — serbest</label>'
    + '<input type="number" class="fc" id="aidatTutarInput" value="'+(sayisal?curStr:'')+'" placeholder="Örn: 750">'
    + '<div class="muted" style="margin-top:4px">Fazla ödeme varsa aidat borcu otomatik düşülür.</div>'
    + '</div>'
    + '<div id="eskiWrap" class="fg" style="'+(isEski?'':'display:none')+'">'
    + '<label>Eski Sakin Türü</label>'
    + '<select class="fc" id="eskiTip">'
    + '<option '+(curStr==='ESKİ SAHİBİ'?'selected':'')+'>ESKİ SAHİBİ</option>'
    + '<option '+(curStr==='ESKİ KİRACI'?'selected':'')+'>ESKİ KİRACI</option>'
    + '</select></div>'
    + '<button class="btn btn-primary btn-block" style="margin-top:14px" onclick="saveAidat(\''+k+'\','+ayIndex+')">Kaydet</button>';

  openModal(body);
  window._aidatSec = sayisal?'tutar':(isOdenmedi?'odenmedi':(isMuaf?'muaf':(isEski?'eski':'bos')));
}
function aidatSec(tip){
  window._aidatSec = tip;
  document.getElementById('tutarWrap').style.display = tip==='tutar'?'':'none';
  document.getElementById('eskiWrap').style.display = tip==='eski'?'':'none';
}
function saveAidat(k, ayIndex){
  if(!db.aidat[k]) db.aidat[k] = new Array(12).fill('');
  const tip = window._aidatSec;
  let val = '';
  if(tip === 'tutar'){
    const t = Number(document.getElementById('aidatTutarInput').value)||0;
    if(t <= 0){ alert('Geçerli bir tutar girin'); return; }
    val = t;
  } else if(tip === 'odenmedi'){ val = 'ÖDENMEDİ'; }
  else if(tip === 'muaf'){ val = 'MUAF'; }
  else if(tip === 'eski'){ val = document.getElementById('eskiTip').value; }
  else { val = ''; }
  db.aidat[k][ayIndex] = val;
  saveDB();
  closeModal();
  aptDetay(k);
}

function viewDemirbas(){

function demirbasOdemeAl(k){
  const a = getApt(k);
  const d = db.demirbas[k]||{nefestenKalan:4250,odenen:0};
  const kalan = Math.max(0, d.nefestenKalan - d.odenen);
  const body = '<h2>'+k+' - Demirbaş Ödeme Al</h2>'
    + '<div class="muted" style="margin-bottom:10px">'+(a?a.isim||'-':'-')+'</div>'
    + '<div class="li"><div class="li-t">Nefesten Kalan</div><div class="li-v">'+fmtMoney(d.nefestenKalan)+'</div></div>'
    + '<div class="li"><div class="li-t">Şu ana kadar ödenen</div><div class="li-v green">'+fmtMoney(d.odenen)+'</div></div>'
    + '<div class="li"><div class="li-t">Kalan borç</div><div class="li-v red">'+fmtMoney(kalan)+'</div></div>'
    + '<div class="fg" style="margin-top:12px"><label>Alınacak Tutar (₺) — serbest</label>'
    + '<input type="number" class="fc" id="dmTutar" value="'+kalan+'"></div>'
    + '<button class="btn btn-primary btn-block" onclick="demirbasOdemeKaydet(\''+k+'\')">Kaydet</button>';
  openModal(body);
}
function demirbasOdemeKaydet(k){
  const tutar = Number(document.getElementById('dmTutar').value)||0;
  if(tutar <= 0){ alert('Tutar girin'); return; }
  if(!db.demirbas[k]) db.demirbas[k] = {nefestenKalan:4250, odenen:0};
  const kalan = Math.max(0, db.demirbas[k].nefestenKalan - db.demirbas[k].odenen);
  db.demirbas[k].odenen = (db.demirbas[k].odenen||0) + tutar;
  if(tutar > kalan){
    const fazlaTutar = tutar - kalan;
    db.fazlaOdemeler[k] = (db.fazlaOdemeler[k]||0) + fazlaTutar;
    alert('✓ '+fmtMoney(tutar)+' kaydedildi.\n\n💚 '+fmtMoney(fazlaTutar)+' fazla ödeme olarak kaydedildi.');
  } else {
    alert(fmtMoney(tutar)+' ödeme kaydedildi.');
  }
  saveDB();
  closeModal();
  render();
}

let _geciciKalemler = [];
function yeniProjeForm(){
  _geciciKalemler = [{ad:'',tutar:0}];
  renderProjeForm();
}
function renderProjeForm(){
  let toplam = 0;
  _geciciKalemler.forEach(function(k){ toplam += Number(k.tutar)||0; });

  const daireBasi = seciliSay? toplam/seciliSay : 0;

  let body = '<h2>Yeni Demirbaş Projesi</h2>'
    + '<div class="fg"><label>Başlık</label>'
    + '<input class="fc" id="p_baslik" placeholder="Örn: Asansör Motor Değişimi"></div>'

    body += '<div class="kalem-row">'
      + '<input class="fc" placeholder="Kalem adı" value="'+(k.ad||'')+'" oninput="_geciciKalemler['+i+'].ad=this.value">'
      + '<input class="fc" type="number" placeholder="Tutar" value="'+(k.tutar||'')+'" style="max-width:110px" oninput="_geciciKalemler['+i+'].tutar=Number(this.value)||0;renderProjeForm()">'
      + '<button class="btn btn-sm btn-danger" onclick="_geciciKalemler.splice('+i+',1);renderProjeForm()">✕</button>'
      + '</div>';
  });

  body += '</div>'
    + '<button class="btn btn-block" onclick="_geciciKalemler.push({ad:\'\',tutar:0});renderProjeForm()">+ Kalem Ekle</button>'
    + '<div class="divider"></div>'
    + '<div class="li"><div class="li-t">Toplam Tutar</div><div class="li-v" style="font-size:1.05rem">'+fmtMoney(toplam)+'</div></div>'
    + '<div class="divider"></div>'
    + '<div class="sec-title">👥 Kime Yansıtılacak?</div>'
    + '<div class="row" style="gap:8px;margin-bottom:8px">'
    + '<label class="apt-check on" id="tumChk" onclick="secTum();event.preventDefault()">'
    + '<input type="radio" name="kapsam" value="tum" checked onchange="secTum()"> Tüm 32 daire</label>'
    + '<label class="apt-check" id="secChk" onclick="secSecili();event.preventDefault()">'
    + '<input type="radio" name="kapsam" value="sec" onchange="secSecili()"> Belirli daireler</label>'
    + '</div>'
    + '<div id="aptSelectWrap" class="hidden"><div class="muted" style="margin-bottom:6px">Daire seç (çoklu):</div><div class="apt-check-grid">';

  db.apartments.forEach(function(a){
    const k = aptKey(a);
    body += '<label class="apt-check" id="chk_'+k+'"><input type="checkbox" value="'+k+'" onchange="toggleApt(\''+k+'\')"> '+k+'</label>';
  });

  body += '</div></div>'
    + '<div class="divider"></div>'
    + '<div class="li"><div class="li-t">Daire Başına Düşen ('+seciliSay+' daire)</div><div class="li-v" id="dbVal">'+fmtMoney(daireBasi)+'</div></div>'
    + '<button class="btn btn-primary btn-block" style="margin-top:10px" onclick="projeKaydet()">✅ Tamam ve Kaydet</button>';

  openModal(body);
  secTum();
}
function secTum(){
  const tumChk = document.getElementById('tumChk');
  const secChk = document.getElementById('secChk');
  if(!tumChk) return;
  tumChk.classList.add('on'); secChk.classList.remove('on');
  document.getElementById('aptSelectWrap').classList.add('hidden');
  const r = document.querySelector('input[name="kapsam"][value="tum"]'); if(r) r.checked = true;
  updateDaireBasi();
}
function secSecili(){
  const tumChk = document.getElementById('tumChk');
  const secChk = document.getElementById('secChk');
  if(!secChk) return;
  tumChk.classList.remove('on'); secChk.classList.add('on');
  document.getElementById('aptSelectWrap').classList.remove('hidden');
  const r = document.querySelector('input[name="kapsam"][value="sec"]'); if(r) r.checked = true;
  updateDaireBasi();
}
function toggleApt(k){
  const el = document.getElementById('chk_'+k);
  const inp = el.querySelector('input');
  el.classList.toggle('on', inp.checked);
  updateDaireBasi();
}
function secilenDaireler(){
  const r = document.querySelector('input[name="kapsam"]:checked');
  if(!r) return tumDaireKodlari();
  if(r.value === 'tum') return tumDaireKodlari();
  return Array.from(document.querySelectorAll('#aptSelectWrap input[type="checkbox"]:checked')).map(function(c){ return c.value; });
}
function updateDaireBasi(){
  let toplam = 0;
  _geciciKalemler.forEach(function(k){ toplam += Number(k.tutar)||0; });
  const sec = secilenDaireler();
  const v = sec.length? toplam/sec.length : 0;
  const el = document.getElementById('dbVal');
  if(el) el.textContent = fmtMoney(v);
}
function projeKaydet(){
  const baslik = document.getElementById('p_baslik').value.trim();
  if(!baslik){ alert('Başlık gerekli'); return; }
  const kalemler = _geciciKalemler.filter(function(k){ return k.ad.trim() && k.tutar>0; });
  if(!kalemler.length){ alert('En az bir kalem ve tutar gerekli'); return; }
  let toplam = 0;
  kalemler.forEach(function(k){ toplam += Number(k.tutar); });
  const sec = secilenDaireler();
  if(!sec.length){ alert('En az bir daire seçin'); return; }
  const daireBasi = toplam / sec.length;

  db.demirbasProjeler.push({
    id: Date.now(), baslik: baslik,
    kalemler: kalemler.map(function(k){ return {ad:k.ad.trim(), tutar:Number(k.tutar)}; }),
    toplam: toplam, secilenDaireler: sec, daireBasi: daireBasi,
    tarih: new Date().toISOString().slice(0,10),
    odemeler: {}
  });
  saveDB();
  closeModal();
  render();
  alert('Proje kaydedildi.\n\nToplam: '+fmtMoney(toplam)+'\nDaire başı: '+fmtMoney(daireBasi)+' ('+sec.length+' daire)');
}
function projeDetay(id){
  const p = db.demirbasProjeler.find(function(x){ return x.id===id; });
  if(!p) return;

  let body = '<h2>'+p.baslik+'</h2>'
    + '<div class="muted" style="margin-bottom:10px">📅 '+fmtDate(p.tarih)+' · Daire başı: <b>'+fmtMoney(p.daireBasi)+'</b></div>'
    + '<div class="sec-title">📝 Kalemler</div>';

  p.kalemler.forEach(function(k){
    body += '<div class="li"><div class="li-t">'+k.ad+'</div><div class="li-v">'+fmtMoney(k.tutar)+'</div></div>';
  });

  body += '<div class="li"><div class="li-t"><b>Toplam</b></div><div class="li-v"><b>'+fmtMoney(p.toplam)+'</b></div></div>'
    + '<div class="divider"></div>'
    + '<div class="sec-title">👥 Ödeme Durumu ('+p.secilenDaireler.length+' daire)</div>'
    + '<div class="odemeli-list">';

  p.secilenDaireler.forEach(function(k){
    const a = getApt(k);
    const od = p.odemeler[k]||0;
    const kl = Math.max(0, p.daireBasi - od);
    const telVar = a && telGecerliMi(a.telefon);
    let cls = 'borc';
    if(kl === 0) cls = 'odendi';
    else if(od > 0) cls = 'kismi';
    body += '<div class="odeme-satir '+cls+'">'
      + '<div class="ds-kod">'+k+'</div>'
      + '<div class="ds-isim">'+(a?a.isim||'-':'-')+'</div>'
      + '<div class="ds-tutar">'+od.toLocaleString('tr-TR')+' / '+p.daireBasi.toLocaleString('tr-TR')
      + (kl>0?'<br><span style="color:#c62828">'+kl.toLocaleString('tr-TR')+' kaldı</span>':'<br><span style="color:#2e7d32">✓ ödendi</span>')
      + '</div>'
      + '<div class="ds-btn">'
      + '<button class="btn btn-xs btn-success" onclick="odemeAlProje('+p.id+',\''+k+'\')">💵 Al</button>'
      + (telVar?'<button class="btn btn-xs btn-wa" onclick="bildirimGonder(\''+k+'\')">📱</button>':'')
      + '</div></div>';
  });

  body += '</div><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="closeModal()">Kapat</button>';
  openModal(body);
}
function odemeAlProje(projeId, k){
  const p = db.demirbasProjeler.find(function(x){ return x.id===projeId; });
  if(!p) return;
  const mevcut = p.odemeler[k]||0;
  const kalan = Math.max(0, p.daireBasi - mevcut);
  const body = '<h2>'+k+' - Ödeme Al</h2>'
    + '<div class="li"><div class="li-t">Daire başı tutar</div><div class="li-v">'+fmtMoney(p.daireBasi)+'</div></div>'
    + '<div class="li"><div class="li-t">Şu ana kadar ödenen</div><div class="li-v green">'+fmtMoney(mevcut)+'</div></div>'
    + '<div class="li"><div class="li-t">Kalan</div><div class="li-v red">'+fmtMoney(kalan)+'</div></div>'
    + '<div class="fg" style="margin-top:12px"><label>Alınacak Tutar (₺) — serbest</label>'
    + '<input class="fc" type="number" id="odTutar" value="'+kalan+'"></div>'
    + '<button class="btn btn-primary btn-block" onclick="odemeKaydetProje('+projeId+',\''+k+'\')">Kaydet</button>'
    + '<button class="btn btn-block" style="margin-top:8px" onclick="projeDetay('+projeId+')">← Geri</button>';
  openModal(body);
}
function odemeKaydetProje(projeId, k){
  const p = db.demirbasProjeler.find(function(x){ return x.id===projeId; });
  if(!p) return;
  const tutar = Number(document.getElementById('odTutar').value)||0;
  if(tutar <= 0){ alert('Tutar girin'); return; }
  const kalan = Math.max(0, p.daireBasi - (p.odemeler[k]||0));
  p.odemeler[k] = (p.odemeler[k]||0) + tutar;
  if(tutar > kalan){
    const fazlaTutar = tutar - kalan;
    db.fazlaOdemeler[k] = (db.fazlaOdemeler[k]||0) + fazlaTutar;
    alert('✓ '+fmtMoney(tutar)+' kaydedildi.\n\n💚 '+fmtMoney(fazlaTutar)+' fazla ödeme olarak kaydedildi (alacaklı).');
  } else {
    alert(fmtMoney(tutar)+' ödeme kaydedildi.');
  }
  saveDB();
  projeDetay(projeId);
}
function projeSil(id){
  if(!confirm('Proje silinsin mi?')) return;
  db.demirbasProjeler = db.demirbasProjeler.filter(function(p){ return p.id!==id; });
  saveDB();
  render();
}

/* ============ WHATSAPP ============ */
function bildirimGonder(k){
  const a = getApt(k);
  if(!a) return;
  if(!telGecerliMi(a.telefon)){
    alert('Bu dairenin telefon numarası kayıtlı değil.\n\nDaire detayından ekleyebilirsin.');
    return;
  }
  const toplamBorc = aidatKalan(k) + demirbasToplamBorc(k);
  const fazla = fazlaOdemesi(k);
  const sablon = toplamBorc > 0 ? db.sablonlar.borcHatirlatma : db.sablonlar.borcYok;
  const mesaj = sablonDoldur(sablon, k);

  let body = '<h2>📱 WhatsApp Bildirim</h2>'
    + '<div class="li"><div class="li-t">Daire</div><div class="li-v">'+k+'</div></div>'
    + '<div class="li"><div class="li-t">İsim</div><div class="li-v" style="font-size:.82rem">'+(a.isim||'-')+'</div></div>'
    + '<div class="li"><div class="li-t">Telefon</div><div class="li-v" style="font-size:.82rem">'+a.telefon+'</div></div>'
    + '<div class="li"><div class="li-t">Toplam Borç</div><div class="li-v '+(toplamBorc>0?'red':'green')+'">'+fmtMoney(toplamBorc)+'</div></div>';
  if(fazla>0) body += '<div class="li"><div class="li-t">Fazla Ödeme</div><div class="li-v teal">+'+fmtMoney(fazla)+'</div></div>';

  body += '<div class="fg" style="margin-top:12px"><label>Mesaj Önizleme (düzenleyebilirsin)</label>'
    + '<textarea class="fc" id="waMesaj" rows="14">'+mesaj+'</textarea></div>'
    + '<button class="btn btn-wa btn-block" onclick="waGonderOnayli(\''+k+'\')">📱 WhatsApp\'ta Aç ve Gönder</button>'
    + '<button class="btn btn-block" style="margin-top:8px" onclick="closeModal()">İptal</button>';
  openModal(body);
}
function waGonderOnayli(k){
  const mesaj = document.getElementById('waMesaj').value;
  const ok = whatsappGonder(k, mesaj);
  if(ok){
    closeModal();
    alert('WhatsApp açıldı. Mesajı göndermek için "Gönder" butonuna bas.');
  } else {
    alert('Gönderilemedi. Telefon numarasını kontrol edin.');
  }
}

function topluSec(mod){
  const kutular = document.querySelectorAll('#bildirimListesi input[type="checkbox"]');
  kutular.forEach(function(c){
    const borc = Number(c.dataset.borc)||0;
    if(mod === 'hepsi') c.checked = true;
    else if(mod === 'borclu') c.checked = borc > 0;
    else if(mod === 'temizle') c.checked = false;
  });
}
function topluGonder(){
  const secili = Array.from(document.querySelectorAll('#bildirimListesi input[type="checkbox"]:checked')).map(function(c){ return c.value; });
  if(!secili.length){ alert('Hiç daire seçilmedi'); return; }
  if(!confirm(secili.length+' daireye WhatsApp açılacak. Devam edilsin mi?')) return;
  secili.forEach(function(k, i){
    setTimeout(function(){ bildirimGonder(k); }, i * 700);
  });
  alert(secili.length+' daire için WhatsApp penceresi açılıyor.');
}
function hizliTelefon(k){
  const a = getApt(k);
  if(!a) return;
  const body = '<h2>'+k+' - Telefon Ekle</h2>'
    + '<div class="muted" style="margin-bottom:10px">'+(a.isim||'-')+'</div>'
    + '<div class="fg"><label>Telefon (WhatsApp)</label>'
    + '<input class="fc" id="htel" value="'+(a.telefon||'')+'" placeholder="05xx xxx xx xx"></div>'
    + '<button class="btn btn-primary btn-block" onclick="hizliTelefonKaydet(\''+k+'\')">Kaydet</button>';
  openModal(body);
}
function hizliTelefonKaydet(k){
  const t = document.getElementById('htel').value.trim();
  if(!telGecerliMi(t)){ alert('Geçerli bir numara girin'); return; }
  const a = getApt(k);
  a.telefon = t;
  saveDB();
  closeModal();
  render();
}

    ay: document.getElementById('g_ay').value.trim(),
    tutar: Number(document.getElementById('g_tutar').value)||0,

  };

function giderSil(id){
  if(!confirm('Silinsin mi?')) return;

    id:Date.now(), baslik:b, icerik:i,
    tarih:new Date().toISOString().slice(0,10),
    onemli: document.getElementById('d_onemli').checked
  });
  saveDB();
  render();

function duyuruSil(id){
  if(!confirm('Silinsin mi?')) return;
  db.duyurular = db.duyurular.filter(function(d){ return d.id!==id; });
  saveDB();
  render();
}

/* ============ EXCEL ============ */
function excelCikar(){
  try{
    const wb = XLSX.utils.book_new();

    const genelData = [
      ['TAHİROĞULLARI ROJBİN SİTESİ - GENEL ÖZET'],
      ['Tarih', new Date().toLocaleDateString('tr-TR')],
      [],
      ['Toplam Daire', 32],
      ['Aidat Borcu Olan', db.apartments.filter(a=>aidatKalan(aptKey(a))>0).length],
      ['Demirbaş Borcu Olan', db.apartments.filter(a=>demirbasToplamBorc(aptKey(a))>0).length],
      ['Fazla Ödeme Yapan', Object.keys(db.fazlaOdemeler).filter(k=>db.fazlaOdemeler[k]>0).length],
      [],
      ['Kasa Başlangıç', db.kasaBaslangic||0],
      ['Toplam Aidat Tahsilat', toplamAidatTahsilat()],
      ['Toplam Demirbaş Tahsilat', toplamDemirbasTahsilat()],
      ['Toplam Gider', toplamGider()],
      ['GÜNCEL KASA', kasaBaki()],
      [],
      ['Toplam Aidat Alacağı', toplamAidatBorc()],
      ['Toplam Demirbaş Alacağı', toplamDemirbasBorc()],
      ['Toplam Fazla Ödeme', toplamFazla()]
    ];
    const wsGenel = XLSX.utils.aoa_to_sheet(genelData);
    wsGenel['!cols'] = [{wch:32},{wch:20}];
    XLSX.utils.book_append_sheet(wb, wsGenel, 'GENEL');

    const dData = [['BLOK','DAİRE','İSİM','TELEFON','PLAKA','EV SAHİBİ İSİM','EV SAHİBİ TELEFON','FAZLA ÖDEME']];
    db.apartments.forEach(function(a){
      const k = aptKey(a);
      dData.push([a.blok, a.daire, a.isim||'', a.telefon||'', a.plaka||'', a.evsahibi||'', a.evTel||'', fazlaOdemesi(k)||0]);
    });
    const wsD = XLSX.utils.aoa_to_sheet(dData);
    wsD['!cols'] = [{wch:6},{wch:7},{wch:26},{wch:16},{wch:14},{wch:22},{wch:16},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsD, 'DAİRELER');

    const aHeader = ['BLOK','DAİRE','İSİM'].concat(AY_ADLARI).concat(['ÖDENEN TUTAR','FAZLA ÖDEME','KALAN BORÇ']);
    const aData = [aHeader];
    db.apartments.forEach(function(a){
      const k = aptKey(a);
      const row = db.aidat[k]||[];
      const aylar = AY_ADLARI.map(function(_, i){
        const v = row[i];
        if(v === undefined || v === null || v === '') return '';
        if(typeof v === 'number') return v;
        const n = Number(v);
        if(!isNaN(n) && n > 0) return n;
        return v;
      });
      aData.push([a.blok, a.daire, a.isim||''].concat(aylar).concat([aidatOdenen(k), fazlaOdemesi(k)||0, aidatKalan(k)]));
    });
    const wsA = XLSX.utils.aoa_to_sheet(aData);
    wsA['!cols'] = [{wch:6},{wch:7},{wch:26}].concat(AY_ADLARI.map(function(){ return {wch:9}; })).concat([{wch:14},{wch:12},{wch:12}]);
    XLSX.utils.book_append_sheet(wb, wsA, 'AİDAT');

    const demCols = ['BLOK','DAİRE','İSİM','NEFESTEN KALAN','ÖDENEN','KALAN'];
    db.demirbasProjeler.forEach(function(p){
      demCols.push(p.baslik+' - Ödenen');
      demCols.push(p.baslik+' - Kalan');
    });
    const dData2 = [demCols];
    db.apartments.forEach(function(a){
      const k = aptKey(a);
      const d = db.demirbas[k]||{nefestenKalan:4250, odenen:0};
      const kalan = Math.max(0, d.nefestenKalan - d.odenen);
      const row = [a.blok, a.daire, a.isim||'', d.nefestenKalan, d.odenen, kalan];
      db.demirbasProjeler.forEach(function(p){
        if(p.secilenDaireler.indexOf(k)>-1){
          const od = p.odemeler[k]||0;
          row.push(od); row.push(Math.max(0, p.daireBasi - od));
        } else { row.push('-'); row.push('-'); }
      });
      dData2.push(row);
    });
    const wsD2 = XLSX.utils.aoa_to_sheet(dData2);
    XLSX.utils.book_append_sheet(wb, wsD2, 'DEMİRBAŞ');

    const eData = [['BLOK','DAİRE','İSİM','DURUMU','OTURDUĞU TARİH','ÇIKTIĞI TARİH','KALAN BORCU']];
    db.eskiOturan.forEach(function(e){
      eData.push([e.blok, e.daire, e.isim, e.durum, e.oturdu||'', e.cikti||'', e.kalan||0]);
    });
    const wsE = XLSX.utils.aoa_to_sheet(eData);
    wsE['!cols'] = [{wch:10},{wch:7},{wch:22},{wch:18},{wch:16},{wch:16},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsE, 'ESKİ OTURAN BORÇ LİSTESİ');

    const gData = [['AÇIKLAMA','AİT OLDUĞU AY','TUTAR (₺)','TARİH','ÖDEME DURUMU']];
    db.giderler.forEach(function(g){
      gData.push([g.aciklama||'', g.ay||'', g.tutar||0, g.tarih||'', g.durum||'']);
    });
    const wsG = XLSX.utils.aoa_to_sheet(gData);
    wsG['!cols'] = [{wch:32},{wch:16},{wch:14},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsG, 'GİDER');

    const tarih = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'Rojbin_Sitesi_'+tarih+'.xlsx');
  } catch(e){
    alert('Excel oluşturulamadı: '+e.message);
  }
}
