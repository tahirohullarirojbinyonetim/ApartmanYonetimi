<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ROJBİN SİTESİ YÖNETİM SİSTEMİ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f7fb;--surface:#ffffff;--surface-soft:#f1f5f9;--primary:#1e3f6e;--primary-light:#e2e8f0;
  --primary-accent:#2563eb;--text:#0f172a;--text-soft:#64748b;--border:#e2e8f0;
  --success:#16a34a;--success-bg:#dcfce7;--danger:#dc2626;--danger-bg:#fee2e2;
  --warning:#d97706;--warning-bg:#fef3c7;--info:#0284c7;--info-bg:#e0f2fe;
  --shadow:0 8px 24px -4px rgba(15,23,42,.08), 0 3px 8px -2px rgba(15,23,42,.04);
  --radius:18px;--radius-sm:12px;--wa:#25d366;
}
body{background:var(--bg);color:var(--text);padding-bottom:110px;font-size:14.5px;line-height:1.5;overflow-x:hidden}

@keyframes pageSlideIn {
  0% { opacity:0; transform:translateY(24px) scale(0.98); filter:blur(4px); }
  60% { opacity:0.9; filter:blur(0px); }
  100% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}
@keyframes modalSlideUp {
  0% { opacity:0; transform:translateY(55px) scale(0.95); }
  100% { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes pulseNotice {
  0%, 100% { transform:scale(1); box-shadow:0 10px 25px rgba(37,99,235,0.25); }
  50% { transform:scale(1.02); box-shadow:0 14px 32px rgba(37,99,235,0.4); }
}
.page-anim {
  animation: pageSlideIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  will-change: transform, opacity, filter;
}

.header{background:linear-gradient(135deg,#1e3f6e 0%,#0f2342 100%);color:#fff;
  padding:22px 18px 26px;border-bottom-left-radius:26px;border-bottom-right-radius:26px;
  box-shadow:0 10px 25px rgba(15,23,42,.18);position:relative;transition:all .3s ease}
.header h1{font-size:1.1rem;font-weight:800;letter-spacing:.3px}
.header .sub{font-size:.78rem;opacity:.88;margin-top:2px}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.app{max-width:640px;margin:0 auto;padding:16px 14px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;
  margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border);
  transition:transform .22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .22s ease}
.card:active{transform:scale(0.995)}
.card-title{font-size:.96rem;font-weight:700;color:var(--primary);
  display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-title .badge-cnt{background:var(--surface-soft);color:var(--primary);
  font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:700}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--radius-sm);padding:13px;
  box-shadow:var(--shadow);border:1px solid var(--border);transition:all .2s ease}
.stat .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-soft);margin-bottom:4px;font-weight:700}
.stat .val{font-size:1.24rem;font-weight:800;color:var(--primary)}
.stat.green{border-left:5px solid var(--success)}
.stat.red{border-left:5px solid var(--danger)}
.stat.yellow{border-left:5px solid var(--warning)}
.stat.blue{border-left:5px solid var(--info)}

.big-stat{background:#fff;border-radius:var(--radius);padding:18px 16px;
  box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;text-align:center;
  transition:transform .2s ease}
.big-stat:active{transform:scale(0.99)}
.big-stat .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-soft);margin-bottom:6px;font-weight:700}
.big-stat .val{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.big-stat.balance{border-top:5px solid var(--success)}
.big-stat.balance .val{color:var(--success)}
.big-stat.expense{border-top:5px solid var(--danger)}
.big-stat.expense .val{color:var(--danger)}

.li{display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;transition:background .15s}
.li:last-child{border-bottom:none}
.li-t{font-weight:600;font-size:.88rem;color:var(--text)}
.li-d{font-size:.75rem;color:var(--text-soft);margin-top:2px}
.li-v{font-weight:700;color:var(--primary);white-space:nowrap;font-size:.88rem}
.li-v.green{color:var(--success)}
.li-v.red{color:var(--danger)}
.li-v.teal{color:#00897b}
.li-actions{display:flex;gap:5px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 18px;border-radius:30px;font-weight:600;font-size:.86rem;
  border:none;cursor:pointer;transition:all .18s cubic-bezier(0.16, 1, 0.3, 1);
  background:var(--surface-soft);color:var(--text)}
.btn:active{transform:scale(.95);box-shadow:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(30,63,110,.25)}
.btn-success{background:var(--success);color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.25)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 4px 12px rgba(220,38,38,.2)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 4px 12px rgba(37,211,102,.25)}
.btn-teal{background:#00897b;color:#fff}
.btn-block{width:100%}
.btn-sm{padding:7px 13px;font-size:.76rem;border-radius:20px}
.btn-xs{padding:5px 10px;font-size:.7rem;border-radius:16px}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff;border:none;padding:7px 13px;
  border-radius:20px;font-size:.78rem;cursor:pointer;font-weight:600;backdrop-filter:blur(4px);transition:all .2s}
.btn-ghost:hover{background:rgba(255,255,255,.28)}

.fg{margin-bottom:12px}
.fg label{display:block;font-size:.76rem;font-weight:600;color:var(--text-soft);margin-bottom:5px}
.fc{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);
  background:#fff;font-size:.9rem;font-family:inherit;transition:all .18s ease}
.fc:focus{outline:none;border-color:var(--primary-accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea.fc{resize:vertical;min-height:85px}

.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:6px 2px max(8px,env(safe-area-inset-bottom));z-index:50;max-width:640px;margin:0 auto;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.bnav button{background:none;border:none;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:.66rem;color:var(--text-soft);
  padding:6px 2px;flex:1;cursor:pointer;font-weight:600;transition:all .22s cubic-bezier(0.16, 1, 0.3, 1)}
.bnav button .ic{font-size:1.25rem;transition:transform .22s cubic-bezier(0.16, 1, 0.3, 1)}
.bnav button.active{color:var(--primary);font-weight:800}
.bnav button.active .ic{transform:translateY(-3px) scale(1.15)}

.apt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.apt-btn{background:var(--surface-soft);border:1px solid var(--border);
  border-radius:14px;padding:14px 12px;text-align:left;
  font-weight:700;font-size:.95rem;cursor:pointer;color:var(--text);
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:var(--shadow);transition:all .2s cubic-bezier(0.16, 1, 0.3, 1)}
.apt-btn:active{transform:scale(.95)}
.apt-btn .daire-no{font-size:1.08rem;color:var(--primary);margin-bottom:2px}
.apt-btn.paid{background:var(--success-bg);border-color:#86efac}
.apt-btn.paid .daire-no{color:#15803d}
.apt-btn.unpaid{background:var(--danger-bg);border-color:#fca5a5}
.apt-btn.unpaid .daire-no{color:#b91c1c}
.apt-btn.partial{background:var(--warning-bg);border-color:#fde047}
.apt-btn.muaf{background:#e2e8f0;border-color:#cbd5e1}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;
  border:1px solid var(--border);position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.74rem;background:#fff}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid #f1f5f9;white-space:nowrap}
th{background:#f8fafc;color:var(--text-soft);font-weight:700;font-size:.68rem;text-transform:uppercase}
td.left,th.left{text-align:left;padding-left:10px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:30px;background:var(--surface-soft);
  font-size:.78rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .2s ease}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 3px 8px rgba(30,63,110,.3)}

.mov{position:fixed;inset:0;background:rgba(15,23,42,.62);backdrop-filter:blur(4px);display:none;
  align-items:flex-end;justify-content:center;z-index:200;transition:opacity .2s ease}
.mov.open{display:flex}
.mod{background:#fff;width:100%;max-width:640px;border-top-left-radius:26px;
  border-top-right-radius:26px;padding:24px 20px 32px;max-height:92vh;overflow-y:auto;position:relative;
  animation:modalSlideUp .3s cubic-bezier(0.16,1,0.3,1) forwards;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.mod .close{position:absolute;top:16px;right:16px;background:#f1f5f9;border:none;
  width:34px;height:34px;border-radius:50%;font-size:1.05rem;cursor:pointer;font-weight:700;color:#64748b;z-index:10;transition:all .15s}
.mod .close:active{transform:scale(0.9)}
.mod h2{font-size:1.15rem;margin-bottom:14px;color:var(--primary);padding-right:40px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--text-soft);font-size:.78rem}
.sec-title{font-size:.82rem;font-weight:700;color:var(--primary);
  text-transform:uppercase;letter-spacing:.04em;margin:10px 0 8px}
.divider{height:1px;background:var(--border);margin:14px 0}
.empty{text-align:center;padding:26px 16px;color:var(--text-soft);font-size:.85rem}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-soft);
  color:var(--text-soft);font-size:.68rem;font-weight:600;margin-right:4px}

.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-item{background:#fff;border-radius:var(--radius-sm);padding:15px 10px;
  text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);
  cursor:pointer;font-size:.82rem;font-weight:700;display:flex;flex-direction:column;
  align-items:center;gap:6px;transition:all .2s cubic-bezier(0.16, 1, 0.3, 1)}
.more-item:hover{transform:translateY(-2px);border-color:#cbd5e1}
.more-item:active{transform:scale(.96)}
.more-item .ic{font-size:1.5rem;color:var(--primary)}

.kalem-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.kalem-row input{flex:1}
.kalem-row .btn-sm{padding:8px 10px;font-size:.75rem;flex-shrink:0}

.apt-check{display:flex;align-items:center;gap:6px;padding:7px 9px;
  border:1px solid var(--border);border-radius:9px;background:#fff;font-size:.78rem;
  cursor:pointer;user-select:none;transition:all .18s}
.apt-check.on{background:#e0e7ff;border-color:#4f46e5;color:#3730a3;font-weight:700}
.apt-check input{margin:0}
.apt-check-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}

.proj-item{background:#fff;border-radius:var(--radius-sm);
  padding:14px;margin-bottom:12px;border:1px solid var(--border);border-left:5px solid var(--primary);
  box-shadow:var(--shadow);transition:all .2s ease}
.proj-item h4{font-size:.95rem;color:var(--primary);margin-bottom:4px}
.proj-item .meta{font-size:.75rem;color:var(--text-soft);margin-bottom:6px}
.proj-item .bar{height:9px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:8px 0}
.proj-item .bar-fill{height:100%;background:linear-gradient(90deg, #16a34a, #22c55e);border-radius:10px;transition:width .4s ease}

.proj-breakdown{background:var(--surface-soft);border-radius:8px;padding:9px 11px;margin:8px 0;font-size:.75rem}
.proj-breakdown-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #cbd5e1}
.proj-breakdown-row:last-child{border-bottom:none;font-weight:700}

.odemeli-list{display:flex;flex-direction:column;gap:6px}
.odeme-satir{display:flex;align-items:center;gap:6px;padding:9px 11px;
  border:1px solid var(--border);border-radius:11px;background:#fff;transition:transform .15s}
.odeme-satir.odendi{background:var(--success-bg);border-color:#86efac}
.odeme-satir.kismi{background:var(--warning-bg);border-color:#fde047}
.odeme-satir.borc{background:var(--danger-bg);border-color:#fca5a5}
.odeme-satir .ds-kod{font-weight:800;font-size:.84rem;min-width:38px;color:var(--primary)}
.odeme-satir .ds-isim{flex:1;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.odeme-satir .ds-tutar{font-size:.72rem;font-weight:700;white-space:nowrap;text-align:right}
.odeme-satir .ds-btn{flex-shrink:0;display:flex;flex-direction:column;gap:3px}

.bildirim-satir{display:flex;align-items:center;gap:8px;padding:10px;
  border:1px solid var(--border);border-radius:11px;background:#fff;margin-bottom:6px}
.bildirim-satir.no-phone{opacity:.6;background:#f8fafc}
.bildirim-satir .bs-kod{font-weight:800;color:var(--primary);font-size:.82rem}
.bildirim-satir .bs-tel{font-size:.7rem;color:var(--text-soft)}
.bildirim-satir .bs-borc{font-weight:700;font-size:.78rem;color:var(--danger);text-align:right;white-space:nowrap}
.bildirim-satir .bs-borc.ok{color:var(--success)}

.bh-row{display:grid;grid-template-columns:80px 1fr 90px;gap:6px;padding:9px 10px;
  border:1px solid var(--border);border-radius:9px;background:#fff;margin-bottom:5px;font-size:.78rem;align-items:center}
.bh-row .bh-date{font-weight:700;color:var(--primary);font-size:.72rem}
.bh-row .bh-name{font-weight:600}
.bh-row .bh-desc{font-size:.68rem;color:var(--text-soft);grid-column:2/3}
.bh-row .bh-amt{font-weight:700;color:var(--success);text-align:right;font-size:.8rem}
.bh-actions{display:flex;gap:3px;justify-content:flex-end;grid-column:3/4;margin-top:3px}

.uyari{background:#fffbeb;border:1px solid #fde68a;color:#92400e;
  padding:11px 13px;border-radius:11px;font-size:.8rem;margin-bottom:10px}
.uyari.teal{background:#f0fdfa;border-color:#99f6e4;color:#0f766e}
.uyari.red{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.uyari.green{background:#f0fdf4;border-color:#bbf7d0;color:#166534}

.login-wrap{max-width:400px;margin:30px auto;padding:26px 20px;background:#fff;
  border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);animation:pageSlideIn .4s ease}
.login-wrap h2{text-align:center;color:var(--primary);margin-bottom:6px;font-size:1.15rem}
.login-wrap .sub{text-align:center;color:var(--text-soft);font-size:.8rem;margin-bottom:20px}
.login-err{background:var(--danger-bg);color:var(--danger);border:1px solid #fca5a5;
  padding:10px 12px;border-radius:10px;font-size:.82rem;margin-bottom:12px;text-align:center}

.sakin-uyari{background:linear-gradient(135deg,#eff6ff,#dbeafe);color:#1e40af;
  padding:14px;border-radius:14px;margin-bottom:14px;font-size:.84rem;
  border:1px solid #bfdbfe;box-shadow:var(--shadow)}

.year-select{display:flex;align-items:center;gap:8px;margin-bottom:14px;justify-content:center}
.year-select select{padding:8px 14px;border-radius:24px;border:2px solid var(--primary);
  font-size:1rem;font-weight:700;color:var(--primary);background:#fff;cursor:pointer}

.btn-more-toggle{background:#fff;border:1px solid var(--border);color:var(--primary);
  font-weight:700;padding:9px 14px;border-radius:20px;margin-top:9px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.78rem;width:100%;transition:all .18s}
.btn-more-toggle:active{transform:scale(.98)}
.btn-more-toggle:hover{background:var(--surface-soft)}

.profile-switcher{
  display:flex;background:var(--surface-soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;border:1px solid var(--border)
}
.profile-tab{
  flex:1;padding:8px 12px;border-radius:10px;font-size:.78rem;font-weight:700;
  text-align:center;border:none;background:none;cursor:pointer;color:var(--text-soft);
  transition:all .2s cubic-bezier(0.16,1,0.3,1)
}
.profile-tab.active{
  background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(15,23,42,.08)
}
.profile-tab.active.eski{
  color:#b45309;border-bottom:2px solid #f59e0b
}

.zorunlu-modal-wrap{
  background:linear-gradient(145deg, #1e3f6e, #0f2342);
  color:#fff;border-radius:22px;padding:24px 20px;
  box-shadow:0 18px 45px rgba(15,35,66,.4);text-align:center;
  animation:pulseNotice 3.2s infinite ease-in-out;
}
.zorunlu-badge{
  display:inline-block;background:#ef4444;color:#fff;
  font-size:.74rem;font-weight:800;letter-spacing:.05em;
  padding:4px 12px;border-radius:30px;margin-bottom:12px;text-transform:uppercase;
}
.zorunlu-baslik{font-size:1.25rem;font-weight:800;margin-bottom:10px;line-height:1.3}
.zorunlu-aciklama{font-size:.86rem;opacity:.92;line-height:1.5;margin-bottom:18px}
.zorunlu-kutu{
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);
  border-radius:14px;padding:15px;text-align:left;font-size:.88rem;
  max-height:220px;overflow-y:auto;margin-bottom:20px;color:#f8fafc;line-height:1.6
}

.hidden{display:none!important}

.designer-credit{
  text-align:center;
  font-size:0.68rem;
  color:var(--text-soft);
  opacity:0.42;
  margin:28px 0 10px;
  letter-spacing:0.04em;
  font-weight:500;
  user-select:none;
  transition:opacity 0.2s ease;
}
.designer-credit:hover{
  opacity:0.85;
}

#syncBar{position:fixed;top:0;left:0;right:0;height:3px;background:transparent;z-index:999;transition:background .3s}
#syncBar.saving{background:linear-gradient(90deg,#ffc107,#ff9800,#ffc107);background-size:200% 100%;animation:slide 1s linear infinite}
#syncBar.saved{background:#22c55e}
#syncBar.error{background:#ef4444}
@keyframes slide{0%{background-position:0 0}100%{background-position:200% 0}}
#syncStatus{position:fixed;top:8px;right:8px;background:rgba(15,23,42,.85);color:#fff;
  padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600;z-index:998;
  opacity:0;transition:opacity .3s;backdrop-filter:blur(4px)}
#syncStatus.show{opacity:1}
</style>
</head>
<body>

<div id="syncBar"></div>
<div id="syncStatus"></div>
<div id="app"></div>
<nav class="bnav" id="bnav"></nav>
<div class="mov" id="mov"><div class="mod" id="mod">
  <button class="close" id="modCloseBtn" onclick="closeModal()">✕</button>
  <div id="modBody"></div>
</div></div>

<script>
/* =========================================================
   SAKİN PİYANO MÜZİK MOTORU (Web Audio API)
   ========================================================= */
let audioCtx = null;
let musicInterval = null;
let isMusicPlaying = false;

function initAudioContext(){
  if(!audioCtx){
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if(AudioContextClass){
      audioCtx = new AudioContextClass();
    }
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

function playPianoNote(freq, startTime, duration = 2.4, gainLevel = 0.045){
  if(!audioCtx) return;
  try{
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc1.type = 'triangle';
    osc2.type = 'sine';

    osc1.frequency.setValueAtTime(freq, startTime);
    osc2.frequency.setValueAtTime(freq * 2, startTime);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1400, startTime);
    filter.frequency.exponentialRampToValueAtTime(320, startTime + duration);

    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.linearRampToValueAtTime(gainLevel, startTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(startTime);
    osc2.start(startTime);
    osc1.stop(startTime + duration + 0.1);
    osc2.stop(startTime + duration + 0.1);
  }catch(e){}
}

const PIANO_PROGRESSION = [
  { bass: 174.61, chords: [261.63, 329.63, 392.00, 523.25] },
  { bass: 130.81, chords: [261.63, 329.63, 392.00, 493.88] },
  { bass: 110.00, chords: [220.00, 261.63, 329.63, 493.88] },
  { bass: 98.00,  chords: [196.00, 293.66, 329.63, 392.00] }
];

let progStep = 0;
function playMusicLoopStep(){
  if(!isMusicPlaying || !audioCtx) return;
  const now = audioCtx.currentTime;
  const curr = PIANO_PROGRESSION[progStep % PIANO_PROGRESSION.length];
  
  playPianoNote(curr.bass, now, 3.8, 0.06);

  curr.chords.forEach((note, idx) => {
    playPianoNote(note, now + (idx * 0.42), 3.0, 0.038);
  });

  if(progStep % 2 === 0){
    playPianoNote(curr.chords[2] * 1.5, now + 1.8, 2.2, 0.022);
  }

  progStep++;
}

function startAmbientMusic(){
  initAudioContext();
  if(isMusicPlaying) return;
  isMusicPlaying = true;
  playMusicLoopStep();
  if(!musicInterval){
    musicInterval = setInterval(playMusicLoopStep, 3600);
  }
}

function stopAmbientMusic(){
  if(isMusicPlaying){
    isMusicPlaying = false;
    if(musicInterval){
      clearInterval(musicInterval);
      musicInterval = null;
    }
  }
}

/* =========================================================
   SESLİ ASİSTAN MOTORU
   ========================================================= */
function sesliKonus(metin){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(metin);
    utter.lang = 'tr-TR';
    utter.rate = 0.96;
    utter.pitch = 1.05;
    
    const sesler = window.speechSynthesis.getVoices();
    const trSes = sesler.find(s => s.lang === 'tr-TR' || s.lang.startsWith('tr'));
    if(trSes) utter.voice = trSes;
    
    window.speechSynthesis.speak(utter);
  }catch(e){
    console.debug('Ses sentezleme desteklenmiyor:', e);
  }
}

    'BİRSEN','BURCU','CANAN','CEMİLE','CEREN','ÇİĞDEM','DAMLA','DEFNE','DEMET','DENİZ',
    'DUYGU','DİDEM','DİLEK','DİLARA','ECE','EDA','ELİF','ELVAN','EMİNE','ESRA',
    'EZGİ','FATMA','FİLİZ','FUNDA','GAMZE','GİZEM','GONCA','GÖKÇE','GÜL',

    'İREM','JALE','JÜLİDE','KADER','KEZBAN','LALE','LEMAN','LEYLA','MELİS',
    'MELİKE','MERVE','MİNE','MÜJDE','NAZLI','NECLA','NEDİME','NİGAR','NİHAL',
    'NİLAY','NİLGÜN','NİSAN','NUR','NURCAN','NURGÜL','NURSEN','NURSEL','ÖZGE','ÖZLEM',
    'PELİN','PINAR','RABİA','REMZİYE','RENGİN','REYHAN','SAADET','SABRİYE','SEHER','SELDA',
    'SELİN','SELMA','SEMA','SEMRA','SEVCAN','SEVDA','SEVİL','SEVİM','SEVTAP','SİBEL',
    'SİNEM','SONGÜL','SUNA','SÜMEYYE','ŞEBNEM','ŞENAY','ŞİMAL','ŞULE','TÜLAY','TÜRKAN',
    'UMMUHAN','ÜLKÜ','ÜMRAN','ÜNSAL','YASEMİN','YASEMEN','YELİZ','YEŞİM','YILDIZ','ZELİHA',
    'ZEYNEP','ZUHAL','ZÜLEYHA','BÜŞRA','BUSE','BENGÜ','BADE','AZRA','ASLI','ARZU',

  ];
  if(kadinIsimler.indexOf(ad) > -1) return 'kadin';
  const sonHarf = ad.slice(-1);
  if(['A','E','İ','I'].indexOf(sonHarf) > -1 && ad.length > 2) return 'kadin';
  return 'erkek';
}

function hitap(isim){
  if(!isim || isim === '-' || isim.toUpperCase() === 'BİLİNMİYOR') return 'Sayın Sakin';
  const cinsiyet = cinsiyetTahminEt(isim);
  const ad = String(isim).trim().split(' ')[0];
  const adTitle = ad.charAt(0).toUpperCase() + ad.slice(1).toLowerCase();
  if(cinsiyet === 'kadin') return adTitle + ' Hanım';
  if(cinsiyet === 'erkek') return adTitle + ' Bey';
  return 'Sayın ' + adTitle;
}

function fmtDate(s){ 
  if(!s) return '-'; 
  const d=new Date(s); 
  if(isNaN(d))return s;
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();

function aptKey(a){ return a.blok+a.daire; }
function getApt(k){ return db.apartments.find(a=>aptKey(a)===k); }
function tumDaireKodlari(){ return db.apartments.map(a=>aptKey(a)); }
function bugun(){ return new Date().toISOString().slice(0,10); }

function getAidatTable(){
  return db.aktifYil === 2026 ? db.aidat : (db['aidat_'+db.aktifYil] || {});
}
function setAidatTable(tbl){
  if(db.aktifYil === 2026) db.aidat = tbl;
  else db['aidat_'+db.aktifYil] = tbl;
}

function checkAutoFill(){
  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth();
  if(db.aktifYil !== curYear) return; 

  const tbl = getAidatTable();
  let degisiklikVarMi = false;

  db.apartments.forEach(a => {
    const k = aptKey(a);
    if(!tbl[k]) tbl[k] = new Array(12).fill('');
    for(let i = 0; i <= curMonth; i++){
      if(tbl[k][i] === '' || tbl[k][i] === undefined || tbl[k][i] === null){
        tbl[k][i] = 'ÖDENMEDİ';
        degisiklikVarMi = true;
      }
    }
  });

  if(degisiklikVarMi){
    setAidatTable(tbl);
    saveDB();
  }
}

function hucreTutar(v){
  if(v === 'MUAF' || v === 'ÖDENMEDİ' || !v) return 0;
  if(typeof v === 'number') return v;
  const n = Number(v);
  if(!isNaN(n) && n > 0) return n;
  return 0;
}
function aidatOdenen(k){
  const row = getAidatTable()[k] || [];
  return row.reduce((s,v)=>s+hucreTutar(v), 0);
}
function aidatKalanFazlaOncesi(k){
  const row = getAidatTable()[k] || [];
  if(row.some(v=>v==='MUAF')) return 0;
  let doluAySayisi = 0;
  for(let i=0; i<12; i++){ if(row[i] !== undefined && row[i] !== null && row[i] !== '') doluAySayisi++; }
  const beklenen = doluAySayisi * AIDAT_TUTAR;
  return Math.max(0, beklenen - aidatOdenen(k));
}
function fazlaOdemesi(k){ return db.fazlaOdemeler[k] || 0; }
function aidatKalan(k){
  const hesaplanan = aidatKalanFazlaOncesi(k);
  const fazla = fazlaOdemesi(k);
  return Math.max(0, hesaplanan - fazla);
}
function aidatDurum(k){
  const row = getAidatTable()[k] || [];
  if(row.some(v=>v==='MUAF')) return 'muaf';
  const fazla = db.fazlaOdemeler[k] || 0;
  if(fazla > 0 && aidatKalanFazlaOncesi(k) === 0) return 'acik';
  const kalan = aidatKalan(k);
  if(kalan === 0) return 'paid';
  if(aidatOdenen(k) > 0) return 'partial';
  return 'unpaid';
}

function demirbasOdenen(k){ return (db.demirbas[k]&&db.demirbas[k].odenen)||0; }
function demirbasToplamOdenen(k){
  let t = demirbasOdenen(k);
  (db.demirbasProjeler||[]).forEach(p=>{ t += (p.odemeler[k]||0); });
  return t;
}
function demirbasToplamBorc(k){
  let t = 0;
  const d = db.demirbas[k];
  if(d) t += Math.max(0, d.nefestenKalan - d.odenen);
  (db.demirbasProjeler||[]).forEach(p=>{
    if(p.secilenDaireler && p.secilenDaireler.indexOf(k) > -1){
      const od = p.odemeler[k]||0;
      t += Math.max(0, p.daireBasi - od);
    }
  });
  return t;
}

function bankaBaki(){ return Number(db.bankaBakiyesi)||0; }
function bankaBakiEkle(tutar){ db.bankaBakiyesi = (Number(db.bankaBakiyesi)||0) + (Number(tutar)||0); }
function bankaBakiDus(tutar){ db.bankaBakiyesi = (Number(db.bankaBakiyesi)||0) - (Number(tutar)||0); }
function toplamGider(){ return db.giderler.reduce((s,g)=>s+(Number(g.tutar)||0),0); }

function daireBankaHareketleri(k){ return (db.bankaHareketleri||[]).filter(function(h){ return h.daire === k; }); }
function daireBankaToplam(k){ return daireBankaHareketleri(k).reduce(function(s,h){ return s + (Number(h.tutar)||0); }, 0); }

function telToWhatsApp(tel){
  if(!tel) return '';
  const temiz = String(tel).replace(/\D/g,'');
  if(!temiz) return '';
  if(temiz.startsWith('90') && temiz.length >= 12) return temiz;
  if(temiz.startsWith('0')) return '90'+temiz.slice(1);
  if(temiz.length === 10) return '90'+temiz;
  return temiz;
}
function telGecerliMi(tel){
  if(!tel) return false;
  const t = String(tel).trim();
  if(t === '' || t === 'BİLİNMİYOR' || t === 'BILINMIYOR') return false;
  const sadece = t.replace(/\D/g,'');
  return sadece.length >= 10;
}
function telNormalize(tel){ if(!tel) return ''; return String(tel).replace(/\D/g,''); }
function telefonEslestiMi(kayitliTel, girilenTel){
  const a = telNormalize(kayitliTel); const b = telNormalize(girilenTel);
  if(!a || !b) return false;
  if(a === b) return true;
  if(a.length >= 10 && b.length >= 10){ return a.slice(-10) === b.slice(-10); }
  return false;
}

function sablonDoldur(sablon, daireKodu){
  const a = getApt(daireKodu);
  const aidatBorc = aidatKalan(daireKodu);
  const demBorc = demirbasToplamBorc(daireKodu);
  const toplam = aidatBorc + demBorc;
  const fazla = fazlaOdemesi(daireKodu);
  let alacakSatir = '';
  if(fazla > 0) alacakSatir = "\n✅ Alacaklı olduğunuz tutar: " + fmtMoney(fazla) + "\n";
  return sablon
    .split('{ISIM}').join(a?a.isim||'Sakin':'Sakin')
    .split('{DAIRE}').join(daireKodu)
    .split('{AIDAT_ODENEN}').join(fmtMoney(aidatOdenen(daireKodu)))
    .split('{AIDAT_BORC}').join(fmtMoney(aidatBorc))
    .split('{DEMIRBAS_ODENEN}').join(fmtMoney(demirbasToplamOdenen(daireKodu)))
    .split('{DEMIRBAS_BORC}').join(fmtMoney(demBorc))
    .split('{TOPLAM_BORC}').join(fmtMoney(toplam))
    .split('{ALACAK}').join(fmtMoney(fazla))
    .split('{ALACAK_SATIR}').join(alacakSatir)
    .split('{SITE_ADI}').join('Rojbin Sitesi');
}

function whatsappGonder(daireKodu, mesaj){
  const a = getApt(daireKodu);
  if(!a) return false;
  if(!telGecerliMi(a.telefon)) return false;
  const tel = telToWhatsApp(a.telefon);
  const url = 'https://wa.me/'+tel+'?text='+encodeURIComponent(mesaj);
  window.open(url, '_blank');
  db.bildirimGecmisi.push({
    id: Date.now()+Math.random(), daire: daireKodu, tel: tel,
    tarih: new Date().toISOString(), tip: 'whatsapp'
  });
  saveDB();
  return true;
}
function sonBildirimKisa(daireKodu){
  const liste = (db.bildirimGecmisi||[]).filter(b=>b.daire===daireKodu);
  if(!liste.length) return '';
  const s = liste[liste.length-1];
  const d = new Date(s.tarih);
  const gun = Math.floor((Date.now() - d.getTime())/(1000*60*60*24));
  if(gun === 0) return 'bugün';
  if(gun === 1) return 'dün';
  return gun+' gün önce';
}

let _fbReady = false; let _fbSaveTimer = null;
let _fs = null, _doc = null, _setDoc = null, _getDoc = null;
let _auth = null, _signInWithEmailAndPassword = null, _signOut = null, _onAuthStateChanged = null;

function setSyncStatus(status, msg){
  const bar = document.getElementById('syncBar'); const st = document.getElementById('syncStatus');
  if(!bar || !st) return; bar.className = '';
  if(status === 'saving'){ bar.classList.add('saving'); st.textContent = msg||'💾 Kaydediliyor...'; st.classList.add('show'); }
  else if(status === 'saved'){ bar.classList.add('saved'); st.textContent = '✓ Buluta kaydedildi'; st.classList.add('show'); setTimeout(function(){ st.classList.remove('show'); }, 1500); setTimeout(function(){ bar.className=''; }, 1500); }
  else if(status === 'error'){ bar.classList.add('error'); st.textContent = '⚠️ '+(msg||'Hata'); st.classList.add('show'); }
}
function saveToCloud(){
  if(!_fbReady || !_setDoc) return;
  setSyncStatus('saving'); clearTimeout(_fbSaveTimer);
  _fbSaveTimer = setTimeout(async function(){
    try{ await _setDoc(_doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC), JSON.parse(JSON.stringify(db))); setSyncStatus('saved'); }
    catch(e){ setSyncStatus('error', e.message); }
  }, 600);
}
function saveDB(){ saveLocalDB(db); saveToCloud(); }

async function loadFromCloud(){
  if(!_getDoc) return false;
  try{
    const ref = _doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC);
    const snap = await _getDoc(ref);
    if(snap.exists()){
      const cloudData = snap.data();
      if(cloudData && cloudData.apartments && cloudData.apartments.length){
        db = cloudData;
        if(!db.demirbasProjeler) db.demirbasProjeler = [];
        if(!db.aidat_2027) db.aidat_2027 = {};
        if(!db.fazlaOdemeler) db.fazlaOdemeler = {};
        if(!db.islemler) db.islemler = [];
        if(!db.bankaHareketleri) db.bankaHareketleri = [];
        if(!db.denetimKayitlari) db.denetimKayitlari = [];
        if(!db.eskiOturan) db.eskiOturan = [];
        if(db.bankaBakiyesi === undefined || db.bankaBakiyesi === 0){ db.bankaBakiyesi = KASA_BASLANGIC_VARSAYILAN; }
        if(!db.sablonlar) db.sablonlar = JSON.parse(JSON.stringify(DEFAULT_SABLONLAR));
        if(!db.bildirimGecmisi) db.bildirimGecmisi = [];
        if(!db.aktifYil) db.aktifYil = 2026;
        saveLocalDB(db);
      }
    }
    return true;
  }catch(e){ return false; }
}

let currentPage = 'home'; let isAdmin = false; let sakinDaireKodu = null;
let _sonSesliDuyuruId = null;

/* KRİTİK GÜVENLİK: Sakin mi kontrolü */
function isSakin(){
  return !!sakinDaireKodu && !isAdmin;
}

function renderNav(){
  const nav = document.getElementById('bnav');
  let items = '';
  // KRİTİK: isAdmin VE sakinDaireKodu aynı anda olmamalı
  if(isAdmin && !sakinDaireKodu){
    items = '<button data-page="home" class="'+(currentPage==='home'?'active':'')+'"><span class="ic">🏠</span>Ana Sayfa</button>'
      + '<button data-page="apartments" class="'+(currentPage==='apartments'?'active':'')+'"><span class="ic">🏢</span>Daireler</button>'
      + '<button data-page="aidat" class="'+(currentPage==='aidat'?'active':'')+'"><span class="ic">💰</span>Aidat</button>'
      + '<button data-page="demirbas" class="'+(currentPage==='demirbas'?'active':'')+'"><span class="ic">🏗️</span>Demirbaş</button>'
      + '<button data-page="gider" class="'+(currentPage==='gider'?'active':'')+'"><span class="ic">🧾</span>Giderler</button>';
  } else if(sakinDaireKodu){ 
    items = '<button data-page="sakin-home" class="'+(currentPage==='sakin-home'?'active':'')+'"><span class="ic">🏠</span>Dairem</button>'; 
  } else { 
    items = '<button data-page="home" class="active"><span class="ic">🏠</span>Ana Sayfa</button>'; 
  }
  nav.innerHTML = items;
  const btns = nav.querySelectorAll('button');
  for(let i=0;i<btns.length;i++){ btns[i].addEventListener('click', function(){ navTo(this.dataset.page); }); }
}

function navTo(page){
  // KRİTİK: Sakin girişliyse sadece kendi sayfalarına gidebilir
  if(isSakin()){
    if(page !== 'sakin-home' && page !== 'home'){
      return;
    }
  }
  
  if(page === 'login'){ currentPage = 'login'; renderNav(); render(); window.scrollTo(0,0); return; }
  if(page === 'sakin-login'){ currentPage = 'sakin-login'; renderNav(); render(); window.scrollTo(0,0); return; }
  if(page === 'sakin-home'){ if(!sakinDaireKodu){ return; } currentPage = 'sakin-home'; renderNav(); render(); window.scrollTo(0,0); return; }
  if(!isAdmin && page!=='home'){ return; }
  currentPage = page; renderNav(); render(); window.scrollTo(0,0);
}

function render(){
  // KRİTİK: Sakin kullanıcı yönetici sayfalarına erişemez
  if(isSakin()){
    const adminPages = ['apartments','aidat','demirbas','eski','gider','islemler','duyurular','denetim','bildirimler','sablonlar'];
    if(adminPages.indexOf(currentPage) > -1){
      currentPage = 'sakin-home';
    }
  }
  
  const app = document.getElementById('app');
  let viewHtml = '';
  if(currentPage === 'login'){ viewHtml = viewLogin(); }
  else if(currentPage === 'sakin-login'){ viewHtml = viewSakinLogin(); }
  else if(currentPage === 'sakin-home'){ viewHtml = viewSakinHome(); }
  else {
    switch(currentPage){
      case 'home': viewHtml = viewHome(); break;
      case 'apartments': viewHtml = viewApartments(); break;
      case 'aidat': viewHtml = viewAidat(); break;
      case 'demirbas': viewHtml = viewDemirbas(); break;
      case 'eski': viewHtml = viewEski(); break;
      case 'gider': viewHtml = viewGider(); break;
      case 'islemler': viewHtml = viewIslemler(); break;
      case 'duyurular': viewHtml = viewDuyurular(); break;
      case 'denetim': viewHtml = viewDenetim(); break;
      case 'bildirimler': viewHtml = viewBildirimler(); break;
      case 'sablonlar': viewHtml = viewSablonlar(); break;
      default: viewHtml = viewHome();
    }
  }
  
  const footerCredit = '<div class="designer-credit">Esafil S. tarafından tasarlanmıştır.</div>';
  app.innerHTML = '<div class="page-anim">' + viewHtml + footerCredit + '</div>';
}

  const btn = document.getElementById('loginBtn');

function sakinLoginSubmit(){
  // KRİTİK GÜVENLİK: Sakin girişinde yönetici yetkisini zorla kapat
  isAdmin = false;
  if(_signOut && _auth){
    try { _signOut(_auth); } catch(e) {}
  }
  
  startAmbientMusic();
  const daire = document.getElementById('sakinDaire').value; 
  const tel = document.getElementById('sakinTel').value.trim();
  const errEl = document.getElementById('sakinErr'); 
  errEl.innerHTML = '';
  if(!daire || !tel){ errEl.innerHTML = '<div class="login-err">Daire ve telefon gereklidir.</div>'; return; }
  const a = getApt(daire);
  if(!a){ errEl.innerHTML = '<div class="login-err">Daire bulunamadı.</div>'; return; }
  if(!telGecerliMi(a.telefon)){ errEl.innerHTML = '<div class="login-err">Bu daireye ait kayıtlı telefon numarası bulunmuyor.</div>'; return; }
  if(!telefonEslestiMi(a.telefon, tel)){ errEl.innerHTML = '<div class="login-err">Girdiğiniz numara daire kaydıyla uyuşmuyor.</div>'; return; }

  const yeniLog = {
    id: 'log_' + Date.now(),
    tarih: new Date().toISOString(),
    tip: 'sakin',
    daire: daire,
    isim: a.isim || '(isim yok)'
  };
  if(!db.denetimKayitlari) db.denetimKayitlari = [];
  db.denetimKayitlari.push(yeniLog);
  saveDB();

  sakinDaireKodu = daire; 
  sessionStorage.setItem('sakin_daire', daire);
  currentPage = 'sakin-home'; 
  renderNav(); 
  render(); 
  window.scrollTo(0,0);

  // Cinsiyetli hitap
  const hitapMetni = hitap(a.isim);
  
  // Okunmamış duyuru var mı
  const dKodStr = String(daire).trim().toUpperCase();
  const okunmamisDuyuruVar = (db.duyurular || []).some(d => {
    const hedefte = (!d.hedef || d.hedef === 'hepsi' || 
      (d.seciliDaireler && d.seciliDaireler.map(x=>String(x).trim().toUpperCase()).indexOf(dKodStr) > -1));
    const okundu = d.okuyanlar && d.okuyanlar.map(x=>String(x).trim().toUpperCase()).indexOf(dKodStr) > -1;
    return hedefte && !okundu;
  });

  let karsilama = "Hoş geldiniz " + hitapMetni + ", daire bilgileriniz yüklendi.";
  if(okunmamisDuyuruVar){
    karsilama += " Size önemli bir duyuru var, lütfen inceleyiniz.";
  }
  sesliKonus(karsilama);
  
  setTimeout(() => {
    checkOkunmamisDuyuru(daire);
  }, 600);
}

/* ============ SAKİN ZORUNLU DUYURU KONTROLÜ ============ */
function checkOkunmamisDuyuru(daireKodu){
  const duyurular = db.duyurular || [];
  const dKodStr = String(daireKodu).trim().toUpperCase();
  const okunmamis = duyurular.find(d => {
    const daireHedefte = (!d.hedef || d.hedef === 'hepsi' || (d.seciliDaireler && d.seciliDaireler.map(x=>String(x).trim().toUpperCase()).indexOf(dKodStr) > -1));
    const okundu = d.okuyanlar && d.okuyanlar.map(x=>String(x).trim().toUpperCase()).indexOf(dKodStr) > -1;
    return daireHedefte && !okundu;
  });

  if(okunmamis){
    zorunluDuyuruBalonAc(okunmamis, dKodStr);
    if(_sonSesliDuyuruId !== okunmamis.id){
      _sonSesliDuyuruId = okunmamis.id;
      sesliKonus("Dikkat! Dairenize ait yeni bir duyuru bulunmaktadır. Lütfen inceleyiniz.");

function zorunluDuyuruDetayGoster(duyuruId, daireKodu){
  const d = (db.duyurular||[]).find(x => x.id === duyuruId);
  if(!d) { closeModal(); return; }

  const body = '<div class="zorunlu-modal-wrap" style="animation:none;box-shadow:none;padding:16px 8px">'
    + '<div class="zorunlu-badge" style="background:#2563eb">📢 SİTE YÖNETİMİ DUYURUSU</div>'
    + '<div class="zorunlu-baslik" style="font-size:1.15rem;margin-bottom:6px">'+d.baslik+'</div>'
    + '<div class="muted" style="color:#cbd5e1;margin-bottom:14px">Tarih: '+fmtDate(d.tarih)+'</div>'
    + '<div class="zorunlu-kutu">'+d.icerik+'</div>'
    + '<button class="btn btn-success btn-block" style="padding:15px;font-size:1rem;font-weight:800;border-radius:30px" onclick="zorunluDuyuruOnayla('+d.id+', \''+daireKodu+'\')">✅ OKUDUM, ANLADIM</button>'
    + '</div>';

  openModal(body, false);
}

function zorunluDuyuruOnayla(duyuruId, daireKodu){
  const dKodStr = String(daireKodu).trim().toUpperCase();
  const d = (db.duyurular||[]).find(x => String(x.id) === String(duyuruId));
  if(d){
    if(!d.okuyanlar) d.okuyanlar = [];
    if(!d.okumaDetaylari) d.okumaDetaylari = [];
    
    const okuyanlarList = d.okuyanlar.map(x => String(x).trim().toUpperCase());
    if(okuyanlarList.indexOf(dKodStr) === -1){
      d.okuyanlar.push(dKodStr);
    }
    
    const varMi = d.okumaDetaylari.some(item => {
      const kod = typeof item === 'object' ? item.daire : item;
      return String(kod).trim().toUpperCase() === dKodStr;
    });
    
    if(!varMi){
      const apt = getApt(dKodStr);
      d.okumaDetaylari.push({
        daire: dKodStr,
        isim: apt ? (apt.isim || '-') : '-',
        tarih: new Date().toISOString()
      });
    }
    saveDB();
  }
  closeModal();
  _sonSesliDuyuruId = null;
  setTimeout(() => {
    checkOkunmamisDuyuru(daireKodu);
  }, 350);
}

function eskiSakinDetayKaydet(id, daireKodu){
  if(!isAdmin || sakinDaireKodu) return;
  const e = db.eskiOturan.find(x => x.id === id);
  if(!e) return;
  e.isim = document.getElementById('es_isim').value.trim();
  e.durum = document.getElementById('es_durum').value;
  e.cikti = document.getElementById('es_cikti').value;
  e.kalan = Number(document.getElementById('es_kalan').value)||0;
  saveDB();
  aptDetay(daireKodu);
  alert('Eski sakin bilgileri güncellendi.');
}

function eskiSakinDaireSil(id, daireKodu){
  if(!isAdmin || sakinDaireKodu) return;
  if(!confirm('Bu eski sakin kaydını silmek istediğinize emin misiniz?')) return;
  db.eskiOturan = (db.eskiOturan||[]).filter(x => x.id !== id);
  saveDB();
  aptDetay(daireKodu);
  alert('Eski sakin kaydı silindi.');
}

function yeniEskiSakinDaireyeEkle(daireKodu){
  if(!isAdmin || sakinDaireKodu) return;
  const a = getApt(daireKodu);
  if(!a) return;
  const isim = document.getElementById('yeni_es_isim').value.trim();
  const durum = document.getElementById('yeni_es_durum').value;
  const cikti = document.getElementById('yeni_es_cikti').value;
  const kalan = Number(document.getElementById('yeni_es_kalan').value)||0;
  if(!isim){ alert('İsim gereklidir'); return; }
  
  db.eskiOturan.push({
    id: Date.now(),
    blok: a.blok + ' Blok',
    daire: a.daire,
    isim: isim,
    durum: durum,
    oturdu: '2026-01-01',
    cikti: cikti,
    kalan: kalan,
    odenen: 0
  });
  saveDB();
  aptDetay(daireKodu);
  alert('Eski sakin başarıyla bu daireye bağlandı.');
}

function kaydetApt(k){
  if(!isAdmin || sakinDaireKodu) return;
  const a = getApt(k); if(!a) return;
  a.isim = document.getElementById('f_isim').value.trim();
  a.telefon = document.getElementById('f_telefon').value.trim();
  a.plaka = document.getElementById('f_plaka').value.trim();
  a.evsahibi = document.getElementById('f_evsahibi').value.trim();
  a.evTel = document.getElementById('f_evtel').value.trim();
  const dO = document.getElementById('f_demirOdenen');
  if(dO){
    if(!db.demirbas[k]) db.demirbas[k] = {nefestenKalan:4250, odenen:0};
    const eskiOdenen = db.demirbas[k].odenen || 0;
    const yeniOdenen = Number(dO.value)||0;
    const fark = yeniOdenen - eskiOdenen;
    if(fark > 0) bankaBakiEkle(fark);
    else if(fark < 0) bankaBakiDus(-fark);
    db.demirbas[k].odenen = yeniOdenen;
  }
  saveDB(); closeModal(); render(); alert('Daire güncellendi.');
}

function kaydetVeWhatsapp(k){
  if(!isAdmin || sakinDaireKodu) return;
  kaydetApt(k);
  setTimeout(function(){ bildirimGonder(k); }, 250);
}

function bhYeniForm(k){
  if(!isAdmin || sakinDaireKodu) return;
  const body = '<h2>'+k+' - Banka Hareketi Ekle</h2>'
    + '<div class="fg"><label>Tarih</label><input type="date" class="fc" id="bh_tarih" value="'+bugun()+'"></div>'
    + '<div class="fg"><label>İsim Soyisim</label><input class="fc" id="bh_isim" placeholder="Örn: Yasemin Gürbüz"></div>'
    + '<div class="fg"><label>Tutar (₺)</label><input type="number" step="0.01" class="fc" id="bh_tutar"></div>'
    + '<div class="fg"><label>Açıklama</label><textarea class="fc" id="bh_aciklama" rows="2" placeholder="Dekont notu..."></textarea></div>'
    + '<button class="btn btn-primary btn-block" onclick="bhKaydet(\''+k+'\',null)">Kaydet</button>';
  openModal(body);
}
function bhKaydet(k, editId){
  if(!isAdmin || sakinDaireKodu) return;
  const tarihRaw = document.getElementById('bh_tarih').value;
  const tarih = tarihRaw ? tarihRaw.split('-').reverse().join('.') : bugun().split('-').reverse().join('.');
  const isim = document.getElementById('bh_isim').value.trim();
  const tutar = Number(document.getElementById('bh_tutar').value)||0;
  const aciklama = document.getElementById('bh_aciklama').value.trim();
  if(!isim){ alert('İsim gereklidir'); return; }
  if(tutar <= 0){ alert('Geçerli bir tutar girin'); return; }
  if(editId){
    const h = db.bankaHareketleri.find(x => x.id === editId);
    if(h){ h.tarih = tarih; h.isim = isim; h.tutar = tutar; h.aciklama = aciklama; }
  } else {
    db.bankaHareketleri.push({
      id: 'bh_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      daire: k, tarih: tarih, isim: isim, tutar: tutar, aciklama: aciklama
    });
    bankaBakiEkle(tutar);
  }
  saveDB(); closeModal(); aptDetay(k);
}
function bhDuzenle(id){
  if(!isAdmin || sakinDaireKodu) return;
  const h = (db.bankaHareketleri||[]).find(x => x.id===id);
  if(!h) return;
  const tarihISO = h.tarih.split('.').reverse().join('-');
  const body = '<h2>Banka Hareketini Düzenle</h2>'
    + '<div class="fg"><label>Tarih</label><input type="date" class="fc" id="bh_tarih" value="'+tarihISO+'"></div>'
    + '<div class="fg"><label>İsim Soyisim</label><input class="fc" id="bh_isim" value="'+h.isim+'"></div>'
    + '<div class="fg"><label>Tutar (₺)</label><input type="number" step="0.01" class="fc" id="bh_tutar" value="'+h.tutar+'"></div>'
    + '<div class="fg"><label>Açıklama</label><textarea class="fc" id="bh_aciklama" rows="2">'+(h.aciklama||'')+'</textarea></div>'
    + '<button class="btn btn-primary btn-block" onclick="bhKaydet(\''+h.daire+'\',\''+id+'\')">Kaydet</button>';
  openModal(body);
}
function bhSil(id){
  if(!isAdmin || sakinDaireKodu) return;
  if(!confirm('Bu banka hareketi silinsin mi?')) return;
  const h = (db.bankaHareketleri||[]).find(x => x.id===id);
  const daire = h ? h.daire : null;
  if(h && Number(h.tutar) > 0) bankaBakiDus(Number(h.tutar));
  db.bankaHareketleri = db.bankaHareketleri.filter(x => x.id!==id);
  saveDB(); if(daire) aptDetay(daire);
}

          + '<div class="ds-tutar">'+(tamamiOdenmis?'<span style="color:#16a34a">✓ Borçsuz</span>':fmtMoney(kalan)+'<br><span style="color:#dc2626">Geçmiş Borç</span>')+'</div>'
          + '<div class="ds-btn">'
          + (kalan > 0 ? '<button class="btn btn-xs btn-success" onclick="eskiOdemeAl('+e.id+')">💵 Al</button>' : '')
          + '</div></div>';
      });
    }
    html += '</div></div>';
  } else {
    html += '<div class="tabs"><div class="tab '+(blok==='A'?'active':'')+'" onclick="setAidatBlok(\'A\')">A Blok</div><div class="tab '+(blok==='B'?'active':'')+'" onclick="setAidatBlok(\'B\')">B Blok</div></div>';
    
    const list = db.apartments.filter(a=> a.blok===blok);
    list.forEach(function(a){
      const k = aptKey(a); const row = getAidatTable()[k] || []; const kalan = aidatKalan(k); const fazla = fazlaOdemesi(k);
      html += '<div class="card" style="padding:12px; margin-bottom:10px; border-left:4px solid '+(kalan>0?'var(--danger)':'var(--success)')+';">';
      html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">'
        + '<div style="font-weight:800; font-size:1.05rem; color:var(--primary)">'+k+' - '+(a.isim||'İsimsiz')+'</div>'
        + '<div style="font-size:.8rem; font-weight:700; color:'+(kalan>0?'var(--danger)':'var(--success)')+'">'+(kalan>0 ? fmtMoney(kalan)+' Borç' : 'Borç Yok')+'</div>'
        + '</div>';
      html += '<div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:6px;">';
      AY_ADLARI.forEach(function(ay, i){
        const v = row[i]; let style = 'padding:8px 4px; font-size:0.75rem; border-radius:8px; text-align:center; font-weight:600; border:none; cursor:pointer; '; let btnText = ay.slice(0,3);
        if(v === 'MUAF'){ style += 'background:#e2e8f0; color:#64748b;'; btnText += '<br>Muaf'; }
        else if(v === 'ÖDENMEDİ'){ style += 'background:#fee2e2; color:#b91c1c;'; btnText += '<br>Ödenmedi'; }
        else if(v === 'ESKİ SAHİBİ' || v === 'ESKİ KİRACI'){ style += 'background:#f1f5f9; color:#475569; font-style:italic;'; btnText = 'Eski Sakin'; }
        else if(hucreTutar(v) > 0){ style += 'background:#dcfce7; color:#166534; font-weight:800;'; btnText += '<br>✓ Ödendi'; }
        else { style += 'background:#f8fafc; color:#94a3b8; border:1px dashed #cbd5e1;'; btnText += '<br>—'; }
        html += '<button style="'+style+'" onclick="hizliAidatMenu(\''+k+'\','+i+')">'+btnText+'</button>';
      });

      if(fazla > 0) html += '<div style="margin-top:8px; font-size:0.75rem; color:var(--success); font-weight:700;">💚 Fazla Ödeme Alacağı: +'+fmtMoney(fazla)+'</div>';
      html += '</div>';
    });
  }
  html += '</div>';
  return html;
}

function hizliAidatMenu(daireKodu, ayIndex){
  if(!isAdmin || sakinDaireKodu){ return; }

    + '<button class="btn btn-block" style="margin-bottom:8px;background:#e2e8f0;color:#475569" onclick="hizliAidatKaydet(\''+daireKodu+'\', '+ayIndex+', \'muaf\')">⚪ Muaf Tut</button>'
    + '<button class="btn btn-block" onclick="hizliAidatKaydet(\''+daireKodu+'\', '+ayIndex+', \'bos\')">⬜ Temizle (Boş)</button>';

}

function hizliAidatKaydet(daireKodu, ayIndex, islem){
  if(!isAdmin || sakinDaireKodu){ return; }
  const tbl = getAidatTable();
  if(!tbl[daireKodu]) tbl[daireKodu] = new Array(12).fill('');
  
  if(islem === 'odendi'){
    const tutarInput = document.getElementById('hizliAidatTutar');
    const tutar = Number(tutarInput.value) || AIDAT_TUTAR;
    tbl[daireKodu][ayIndex] = tutar;
  } else if(islem === 'odenmedi'){
    tbl[daireKodu][ayIndex] = 'ÖDENMEDİ';
  } else if(islem === 'muaf'){
    tbl[daireKodu][ayIndex] = 'MUAF';
  } else if(islem === 'bos'){
    tbl[daireKodu][ayIndex] = '';
  }
  setAidatTable(tbl);
  saveDB();
  closeModal();
  render();
}

function hizliKaydet(k){ 
  if(!isAdmin || sakinDaireKodu) return;
  kaydetApt(k); 
}

        html += '<div class="bildirim-satir">'
          + '<div class="bs-info"><div class="bs-kod">'+daireKodu+' - '+(e.isim||'-')+'</div><div class="bs-tel">'+(e.durum||'')+' · Çıkış: '+fmtDate(e.cikti)+'</div></div>'

      + '<button class="btn btn-sm" onclick="topluSec(\'temizle\')">Seçimi Kaldır</button>'
      + '<button class="btn btn-sm btn-wa" onclick="topluGonder()">📱 Seçilenlere Gönder</button>'
      + '</div><div id="bildirimListesi">';

    db.apartments.forEach(function(a){
      const k = aptKey(a);
      const toplam = aidatKalan(k) + demirbasToplamBorc(k);
      const telVar = telGecerliMi(a.telefon);
      const son = sonBildirimKisa(k);
      if(!telVar){
        html += '<div class="bildirim-satir no-phone"><div class="bs-info"><div class="bs-kod">'+k+' - '+(a.isim||'-')+'</div><div class="bs-tel" style="color:#dc2626">📵 Telefon Yok</div></div><div class="bs-borc">'+fmtMoney(toplam)+'</div></div>';
      } else {
        html += '<label class="bildirim-satir" for="bchk_'+k+'"><input type="checkbox" class="bs-check" id="bchk_'+k+'" value="'+k+'" data-borc="'+toplam+'" '+(toplam>0?'checked':'')+'>'
          + '<div class="bs-info"><div class="bs-kod">'+k+' - '+(a.isim||'-')+'</div><div class="bs-tel">📱 '+a.telefon+(son?' · Son: '+son:'')+'</div></div>'
          + '<div class="bs-borc '+(toplam>0?'':'ok')+'">'+(toplam>0?fmtMoney(toplam):'Borçsuz')+'</div></label>';

    });

    html += '</div></div>';
  }

  html += '</div>';
  return html;
}

function eskiSakinWhatsAppModal(id){

  let mesaj = sablon
    .split('{ISIM}').join(e.isim || 'Eski Sakin')

function eskiWaGonder(id){
  if(!isAdmin || sakinDaireKodu) return;
  const e = (db.eskiOturan||[]).find(x => x.id === id);
  if(!e) return;
  const telInput = document.getElementById('eskiWaTel').value.trim();
  const mesaj = document.getElementById('eskiWaMesaj').value;

  renderProjeForm(); 
}

function projeDuzenleForm(id){ 
  if(!isAdmin || sakinDaireKodu) return;
  const p = db.demirbasProjeler.find(x => x.id===id); 
  if(!p) return; 
  _geciciKalemler = p.kalemler.map(k => ({ad:k.ad, tutar:k.tutar}));

    + '<div class="sec-title">📝 Harcama Kalemleri (Neye Para Verilecek?)</div>'

      + '<button class="btn btn-sm btn-danger" onclick="_geciciKalemler.splice('+i+',1);renderProjeForm('+(p?'db.demirbasProjeler.find(x=>x.id==='+p.id+')':'null')+')">✕</button>'

    + '<button class="btn btn-block" style="margin-bottom:12px" onclick="_geciciKalemler.push({ad:\'\',tutar:0});renderProjeForm('+(p?'db.demirbasProjeler.find(x=>x.id==='+p.id+')':'null')+')">+ Yeni Kalem Ekle</button>'
    + '<div class="li"><div class="li-t"><b>Toplam Proje Maliyeti</b></div><div class="li-v" id="projeToplamGosterge">'+fmtMoney(toplam)+'</div></div>'

      + '<label class="apt-check on" id="tumChk" onclick="secTum();event.preventDefault()"><input type="radio" name="kapsam" value="tum" checked> Tüm 32 Daire</label>'
      + '<label class="apt-check" id="secChk" onclick="secSecili();event.preventDefault()"><input type="radio" name="kapsam" value="sec"> Sadece Belirli Daireler</label>'
      + '</div>'
      + '<div id="aptSelectWrap" class="hidden" style="margin-bottom:12px"><div class="muted">Daireleri seçin:</div><div class="apt-check-grid">';

      const k = aptKey(a); 
      body += '<label class="apt-check" id="chk_'+k+'"><input type="checkbox" value="'+k+'" onchange="toggleApt(\''+k+'\')"> '+k+'</label>';

function guncelleProjeHesap(daireSayisi){
  if(!isAdmin || sakinDaireKodu) return;
  let toplam = 0; 
  _geciciKalemler.forEach(k => { toplam += Number(k.tutar)||0; });
  const say = daireSayisi || 32;
  const dVal = say ? (toplam / say) : 0;
  const elTop = document.getElementById('projeToplamGosterge');
  const elDaire = document.getElementById('dbVal');
  if(elTop) elTop.textContent = fmtMoney(toplam);
  if(elDaire) elDaire.textContent = fmtMoney(dVal);
}

function secTum(){ 
  if(!isAdmin || sakinDaireKodu) return;
  const tumChk = document.getElementById('tumChk'); 
  const secChk = document.getElementById('secChk'); 
  if(!tumChk) return; 
  tumChk.classList.add('on'); 
  secChk.classList.remove('on'); 
  document.getElementById('aptSelectWrap').classList.add('hidden'); 
  const r = document.querySelector('input[name="kapsam"][value="tum"]'); 
  if(r) r.checked = true; 
  updateDaireBasi(); 
}
function secSecili(){ 
  if(!isAdmin || sakinDaireKodu) return;
  const tumChk = document.getElementById('tumChk'); 
  const secChk = document.getElementById('secChk'); 
  if(!secChk) return; 
  tumChk.classList.remove('on'); 
  secChk.classList.add('on'); 
  document.getElementById('aptSelectWrap').classList.remove('hidden'); 
  const r = document.querySelector('input[name="kapsam"][value="sec"]'); 
  if(r) r.checked = true; 
  updateDaireBasi(); 
}
function toggleApt(k){ 
  if(!isAdmin || sakinDaireKodu) return;
  const el = document.getElementById('chk_'+k); 
  const inp = el.querySelector('input'); 
  el.classList.toggle('on', inp.checked); 
  updateDaireBasi(); 
}
function secilenDaireler(){ 
  const r = document.querySelector('input[name="kapsam"]:checked'); 
  if(!r || r.value === 'tum') return tumDaireKodlari(); 
  return Array.from(document.querySelectorAll('#aptSelectWrap input[type="checkbox"]:checked')).map(c => c.value); 
}
function updateDaireBasi(){ 
  if(!isAdmin || sakinDaireKodu) return;
  let toplam = 0; 
  _geciciKalemler.forEach(k => { toplam += Number(k.tutar)||0; }); 
  const sec = secilenDaireler(); 
  const v = sec.length ? toplam/sec.length : 0; 
  const el = document.getElementById('dbVal'); 
  if(el) el.textContent = fmtMoney(v); 
  const elTop = document.getElementById('projeToplamGosterge');
  if(elTop) elTop.textContent = fmtMoney(toplam);
}

function projeKaydet(){
  if(!isAdmin || sakinDaireKodu) return;
  const baslik = document.getElementById('p_baslik').value.trim();
  if(!baslik){ alert('Lütfen proje başlığını girin'); return; }
  const kalemler = _geciciKalemler.filter(k => k.ad.trim() && Number(k.tutar)>0);
  if(!kalemler.length){ alert('En az bir geçerli harcama kalemi ve tutarı giriniz.'); return; }
  
  let toplam = 0; 
  kalemler.forEach(k => { toplam += Number(k.tutar); });

  if(!db.demirbasProjeler) db.demirbasProjeler = [];

  if(_duzenlenenProjeId){
    const p = db.demirbasProjeler.find(x => x.id === _duzenlenenProjeId);
    if(!p) return;
    p.baslik = baslik;
    p.kalemler = kalemler.map(k => ({ad:k.ad.trim(), tutar:Number(k.tutar)}));
    p.toplam = toplam;
    p.daireBasi = toplam / (p.secilenDaireler ? p.secilenDaireler.length : 32);
    saveDB(); closeModal(); render(); alert('Demirbaş projesi güncellendi.');
  } else {
    const sec = secilenDaireler();
    if(!sec.length){ alert('Lütfen en az bir daire seçin'); return; }
    const yeniProje = {
      id: Date.now(),
      baslik: baslik,
      kalemler: kalemler.map(k => ({ad:k.ad.trim(), tutar:Number(k.tutar)})),
      toplam: toplam,
      secilenDaireler: sec,
      daireBasi: toplam / sec.length,
      tarih: bugun(),
      odemeler: {}
    };
    db.demirbasProjeler.push(yeniProje);
    saveDB(); closeModal(); render(); alert('Yeni demirbaş projesi başarıyla eklendi ve tüm sakinlere açıldı.');
  }
  _duzenlenenProjeId = null;
}

function projeDetay(id){
  if(!isAdmin || sakinDaireKodu) return;
  const p = db.demirbasProjeler.find(x => x.id===id); 
  if(!p) return;
  let body = '<h2>'+p.baslik+'</h2>'
    + '<div class="muted">Tarih: '+fmtDate(p.tarih)+' · Daire Başı: <b>'+fmtMoney(p.daireBasi)+'</b></div>'
    + '<div class="proj-breakdown" style="margin-top:10px"><b>Harcama Kalemleri:</b>';
  p.kalemler.forEach(k => {
    body += '<div class="proj-breakdown-row"><span>'+k.ad+'</span><span>'+fmtMoney(k.tutar)+'</span></div>';
  });
  body += '<div class="proj-breakdown-row"><span>Genel Toplam</span><span>'+fmtMoney(p.toplam)+'</span></div></div>'
    + '<div class="divider"></div>'
    + '<div class="sec-title">Daire Ödemeleri:</div><div class="odemeli-list">';

  p.secilenDaireler.forEach(function(k){
    const a = getApt(k); 
    const od = p.odemeler[k]||0; 
    const kl = Math.max(0, p.daireBasi - od); 
    const telVar = a && telGecerliMi(a.telefon); 
    let cls = 'borc';
    if(kl === 0) cls = 'odendi'; else if(od > 0) cls = 'kismi';
    body += '<div class="odeme-satir '+cls+'">'
      + '<div class="ds-kod">'+k+'</div>'
      + '<div class="ds-isim">'+(a?a.isim||'-':'-')+'</div>'
      + '<div class="ds-tutar">'+od.toLocaleString('tr-TR')+' / '+p.daireBasi.toLocaleString('tr-TR')
      + (kl>0?'<br><span style="color:#dc2626">'+kl.toLocaleString('tr-TR')+' kaldı</span>':'<br><span style="color:#16a34a">✓ ödendi</span>')+'</div>'
      + '<div class="ds-btn">'
      + '<button class="btn btn-xs btn-success" onclick="odemeAlProje('+p.id+',\''+k+'\')">💵 Al</button>'
      + (telVar?'<button class="btn btn-xs btn-wa" onclick="bildirimGonder(\''+k+'\')">📱</button>':'')
      + '</div></div>';
  });

  body += '</div><button class="btn btn-block" style="margin-top:14px" onclick="closeModal()">Kapat</button>';
  openModal(body);
}

function odemeAlProje(projeId, k){
  if(!isAdmin || sakinDaireKodu) return;
  const p = db.demirbasProjeler.find(x => x.id===projeId); 
  if(!p) return;
  const mevcut = p.odemeler[k]||0; 
  const kalan = Math.max(0, p.daireBasi - mevcut);
  const body = '<h2>'+k+' - Proje Ödemesi Al</h2>'
    + '<div class="li"><div class="li-t">Proje Payı</div><div class="li-v">'+fmtMoney(p.daireBasi)+'</div></div>'
    + '<div class="li"><div class="li-t">Ödenmiş</div><div class="li-v green">'+fmtMoney(mevcut)+'</div></div>'
    + '<div class="li"><div class="li-t">Kalan Borç</div><div class="li-v red">'+fmtMoney(kalan)+'</div></div>'
    + '<div class="fg" style="margin-top:12px"><label>Alınacak Tutar (₺)</label><input class="fc" type="number" step="0.01" id="odTutar" value="'+kalan+'"></div>'
    + '<button class="btn btn-primary btn-block" onclick="odemeKaydetProje('+projeId+',\''+k+'\')">Tahsilatı Kaydet</button>'
    + '<button class="btn btn-block" style="margin-top:8px" onclick="projeDetay('+projeId+')">← Geri</button>';
  openModal(body);
}

function odemeKaydetProje(projeId, k){
  if(!isAdmin || sakinDaireKodu) return;
  const p = db.demirbasProjeler.find(x => x.id===projeId); if(!p) return;
  const tutar = Number(document.getElementById('odTutar').value)||0; 
  if(tutar <= 0){ alert('Geçerli bir tutar girin'); return; }
  const kalan = Math.max(0, p.daireBasi - (p.odemeler[k]||0)); 
  p.odemeler[k] = (p.odemeler[k]||0) + tutar; 
  bankaBakiEkle(tutar);
  if(tutar > kalan){ 
    const fazlaTutar = tutar - kalan;

function giderGuncelle(id){
  if(!isAdmin || sakinDaireKodu) return;
  const g = db.giderler.find(x => x.id===id); if(!g) return;
  const eskiTutar = Number(g.tutar)||0;
  const yeniTutar = Number(document.getElementById('g_tutar').value)||0;
  const fark = yeniTutar - eskiTutar;
  if(fark > 0) bankaBakiDus(fark);
  else if(fark < 0) bankaBakiEkle(-fark);
  g.aciklama = document.getElementById('g_aciklama').value.trim();
  g.ay = document.getElementById('g_ay').value.trim();
  g.tutar = yeniTutar;
  g.tarih = document.getElementById('g_tarih').value;
  g.durum = document.getElementById('g_durum').value;
  saveDB(); closeModal(); render();
}

function giderSil(id){
  if(!isAdmin || sakinDaireKodu) return;
  if(!confirm('Gider kaydı silinsin mi?')) return;
  const g = db.giderler.find(x => x.id===id);
  if(g && Number(g.tutar) > 0) bankaBakiEkle(Number(g.tutar));
  db.giderler = db.giderler.filter(x => x.id!==id);
  saveDB(); render();
}

let _duyuruTopluList = [];
let _duyuruTopluIndex = 0;
let _aktifDuyuruId = null;

function duyuruWhatsAppBaslat(duyuruId){
  if(!isAdmin || sakinDaireKodu) return;
  const d = (db.duyurular||[]).find(x => String(x.id) === String(duyuruId));
  if(!d) return;

  const hedefListe = (!d.hedef || d.hedef === 'hepsi') ? tumDaireKodlari() : (d.seciliDaireler || []);
  
  const gonderilecekler = hedefListe.filter(k => {
    const apt = getApt(k);
    return apt && telGecerliMi(apt.telefon);
  });

  if(!gonderilecekler.length){
    openModal('<h2>📱 WhatsApp Bildirimi</h2><div class="uyari red">Bu duyurunun iletilebileceği telefon numarası kayıtlı bir daire bulunamadı.</div><button class="btn btn-primary btn-block" onclick="closeModal()">Tamam</button>');
    return;
  }

  _aktifDuyuruId = duyuruId;
  _duyuruTopluList = gonderilecekler;
  _duyuruTopluIndex = 0;
  duyuruAsistanGoster();
}

function duyuruAsistanGoster(){
  if(!isAdmin || sakinDaireKodu) return;
  if(_duyuruTopluIndex >= _duyuruTopluList.length){
    let body = '<h2>🎉 Bildirimler Tamamlandı!</h2>'
      + '<div class="uyari green">Duyuru için seçilen tüm dairelerin WhatsApp bildirim süreci tamamlandı.</div>'
      + '<button class="btn btn-primary btn-block" onclick="closeModal();render();">Kapat</button>';
    openModal(body);
    return;
  }

  const d = (db.duyurular||[]).find(x => String(x.id) === String(_aktifDuyuruId));
  if(!d) { closeModal(); return; }

  const k = _duyuruTopluList[_duyuruTopluIndex];
  const a = getApt(k);
  const sira = (_duyuruTopluIndex + 1) + ' / ' + _duyuruTopluList.length;

  let sablon = (db.sablonlar && db.sablonlar.ozelDuyuru) ? db.sablonlar.ozelDuyuru : DEFAULT_SABLONLAR.ozelDuyuru;
  let mesaj = sablon
    .split('{ISIM}').join(a ? a.isim || 'Sakin' : 'Sakin')
    .split('{DAIRE}').join(k)
    .split('{DUYURU_BASLIK}').join(d.baslik)
    .split('{DUYURU_METIN}').join(d.icerik.length > 120 ? d.icerik.slice(0, 120) + '...' : d.icerik);

  let body = '<h2>📢 Duyuru WhatsApp Bildirimi</h2>'
    + '<div class="muted" style="margin-bottom:8px">Sıradaki Daire: <b>'+sira+'</b></div>'
    + '<div class="proj-item" style="border-left-color:var(--wa);margin-bottom:12px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center">'
    + '<h4 style="font-size:1.05rem;color:var(--primary)">'+k+' - '+(a?a.isim||'-':'-')+'</h4>'
    + '<span class="tag" style="background:#e0f2fe;color:#0284c7;font-weight:700">Duyuru Bildirimi</span>'
    + '</div>'
    + '<div class="meta" style="margin-top:4px">📱 '+(a?a.telefon:'-')+' · Başlık: <b>'+d.baslik+'</b></div>'
    + '</div>'
    + '<div class="fg"><label>İletilecek WhatsApp Mesajı:</label><textarea class="fc" id="duyuruAsistanMesaj" rows="8" style="font-size:.82rem">'+mesaj+'</textarea></div>'
    + '<button class="btn btn-wa btn-block" style="padding:14px;font-size:1rem;font-weight:800;margin-bottom:8px" onclick="duyuruAsistanGonderVeIlerle(\''+k+'\')">🚀 WhatsApp\'ı Aç ve Sıradakine Geç ('+sira+')</button>'
    + '<div style="display:flex;gap:6px">'
    + '<button class="btn btn-block" style="background:#f1f5f9;color:#475569;font-size:.78rem" onclick="duyuruAsistanSonraki()">Bu Daireyi Atla ➔</button>'
    + '<button class="btn btn-danger btn-block" style="font-size:.78rem" onclick="closeModal()">İptal Et</button>'
    + '</div>';

  openModal(body);
}

function duyuruHedefSec(tip){
  if(!isAdmin || sakinDaireKodu) return;
  const tumChk = document.getElementById('dTumChk');
  const secChk = document.getElementById('dSecChk');
  const wrap = document.getElementById('duyuruAptSelectWrap');
  const r = document.querySelector('input[name="dKapsam"][value="'+tip+'"]');
  if(r) r.checked = true;

  if(tip === 'hepsi'){
    tumChk.classList.add('on'); secChk.classList.remove('on');
    wrap.classList.add('hidden');
    _duyuruSeciliDaireler = [];
  } else {
    tumChk.classList.remove('on'); secChk.classList.add('on');
    wrap.classList.remove('hidden');
  }
}

function toggleDuyuruApt(k){
  if(!isAdmin || sakinDaireKodu) return;
  const el = document.getElementById('dchk_'+k);
  const inp = el.querySelector('input');
  el.classList.toggle('on', inp.checked);
  if(inp.checked){
    if(_duyuruSeciliDaireler.indexOf(k) === -1) _duyuruSeciliDaireler.push(k);
  } else {
    _duyuruSeciliDaireler = _duyuruSeciliDaireler.filter(x => x !== k);
  }
}

function duyuruEkle(){
  if(!isAdmin || sakinDaireKodu) return;
  const b = document.getElementById('d_baslik').value.trim();
  const i = document.getElementById('d_icerik').value.trim();
  if(!b || !i){ alert('Başlık ve içerik gereklidir'); return; }
  const r = document.querySelector('input[name="dKapsam"]:checked');
  const hedef = r ? r.value : 'hepsi';
  if(hedef === 'secili' && !_duyuruSeciliDaireler.length){
    alert('Lütfen en az bir daire seçin'); return;
  }

  db.duyurular.push({
    id: Date.now(),
    baslik: b,
    icerik: i,
    tarih: bugun(),
    onemli: document.getElementById('d_onemli').checked,
    hedef: hedef,
    seciliDaireler: hedef === 'secili' ? _duyuruSeciliDaireler.slice() : [],
    okuyanlar: [],
    okumaDetaylari: []
  });
  saveDB(); closeModal(); render(); alert('Duyuru başarıyla yayınlandı.');
}

function bildirimGonder(k){
  if(!isAdmin || sakinDaireKodu) return;

  if(!telGecerliMi(a.telefon)){ alert('Bu daireye ait kayıtlı telefon numarası bulunmuyor.'); return; }
  const toplamBorc = aidatKalan(k) + demirbasToplamBorc(k);
  const fazla = fazlaOdemesi(k);
  const sablon = toplamBorc > 0 ? db.sablonlar.borcHatirlatma : db.sablonlar.borcYok;
  const mesaj = sablonDoldur(sablon, k);

  let body = '<h2>📱 WhatsApp Bildirim Gönder</h2>'
    + '<div class="li"><div class="li-t">Daire</div><div class="li-v">'+k+'</div></div>'
    + '<div class="li"><div class="li-t">İsim</div><div class="li-v">'+(a.isim||'-')+'</div></div>'
    + '<div class="li"><div class="li-t">Telefon</div><div class="li-v">'+a.telefon+'</div></div>'
    + '<div class="li"><div class="li-t">Toplam Borç</div><div class="li-v '+(toplamBorc>0?'red':'green')+'">'+fmtMoney(toplamBorc)+'</div></div>';
  if(fazla>0) body += '<div class="li"><div class="li-t">Alacak</div><div class="li-v teal">+'+fmtMoney(fazla)+'</div></div>';
  body += '<div class="fg" style="margin-top:12px"><label>Mesaj Taslağı</label><textarea class="fc" id="waMesaj" rows="12">'+mesaj+'</textarea></div>'
    + '<button class="btn btn-wa btn-block" onclick="waGonderOnayli(\''+k+'\')">📱 WhatsApp\'ta Aç ve İlet</button>'
    + '<button class="btn btn-block" style="margin-top:8px" onclick="closeModal()">İptal</button>';
  openModal(body);
}

function waGonderOnayli(k){
  if(!isAdmin || sakinDaireKodu) return;

  const ok = whatsappGonder(k, mesaj);
  if(ok){ closeModal(); }
}

function topluSec(mod){
  if(!isAdmin || sakinDaireKodu) return;
  const kutular = document.querySelectorAll('#bildirimListesi input[type="checkbox"]');
  kutular.forEach(c => {
    const borc = Number(c.dataset.borc)||0;
    if(mod === 'hepsi') c.checked = true;
    else if(mod === 'borclu') c.checked = borc > 0;
    else if(mod === 'temizle') c.checked = false;
  });
}

let _topluGonderimListesi = [];
let _topluGonderimIndex = 0;

function topluGonder(){
  if(!isAdmin || sakinDaireKodu) return;
  const secili = Array.from(document.querySelectorAll('#bildirimListesi input[type="checkbox"]:checked')).map(c => c.value);
  if(!secili.length){
    openModal('<h2>⚠️ Daire Seçilmedi</h2><div class="uyari red">Lütfen mesaj göndermek istediğiniz en az bir daire seçin.</div><button class="btn btn-primary btn-block" onclick="closeModal()">Tamam</button>');
    return;
  }
  
  _topluGonderimListesi = secili;
  _topluGonderimIndex = 0;
  topluAsistanGoster();
}

function topluAsistanGoster(){
  if(!isAdmin || sakinDaireKodu) return;
  if(_topluGonderimIndex >= _topluGonderimListesi.length){
    let body = '<h2>🎉 Gönderim Tamamlandı!</h2>'
      + '<div class="uyari green">Seçilen tüm dairelerin WhatsApp gönderim süreci tamamlandı.</div>'
      + '<button class="btn btn-primary btn-block" onclick="closeModal();render();">Tamamla ve Kapat</button>';
    openModal(body);
    return;
  }

  const k = _topluGonderimListesi[_topluGonderimIndex];
  const a = getApt(k);
  const toplamBorc = aidatKalan(k) + demirbasToplamBorc(k);
  const sablon = toplamBorc > 0 ? db.sablonlar.borcHatirlatma : db.sablonlar.borcYok;
  const mesaj = sablonDoldur(sablon, k);
  const telVar = a && telGecerliMi(a.telefon);
  const sira = (_topluGonderimIndex + 1) + ' / ' + _topluGonderimListesi.length;

  let body = '<h2>📱 WhatsApp Gönderim Asistanı</h2>'
    + '<div class="muted" style="margin-bottom:8px">Sıradaki Daire: <b>'+sira+'</b></div>'
    + '<div class="proj-item" style="border-left-color:var(--wa);margin-bottom:12px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center">'
    + '<h4 style="font-size:1.1rem;color:var(--primary)">'+k+' - '+(a?a.isim||'-':'-')+'</h4>'
    + '<span class="tag" style="background:'+(toplamBorc>0?'#fee2e2':'#dcfce7')+';color:'+(toplamBorc>0?'#991b1b':'#166534')+';font-weight:800">'+(toplamBorc>0?fmtMoney(toplamBorc):'Borçsuz')+'</span>'
    + '</div>'
    + '<div class="meta" style="margin-top:4px">📱 '+(a?a.telefon:'-')+'</div>'
    + '</div>'
    + '<div class="fg"><label>İletilecek Mesaj:</label><textarea class="fc" id="asistanMesaj" rows="8" style="font-size:.8rem">'+mesaj+'</textarea></div>';

  if(!telVar){
    body += '<div class="uyari red">Bu dairenin geçerli bir telefon numarası bulunmuyor.</div>'
      + '<button class="btn btn-block" style="background:#f1f5f9;color:#475569" onclick="asistanSonraki(false)">Bu Daireyi Atla ➔</button>';
  } else {
    body += '<button class="btn btn-wa btn-block" style="padding:14px;font-size:1rem;font-weight:800;margin-bottom:8px" onclick="asistanGonderVeIlerle(\''+k+'\')">🚀 WhatsApp\'ı Aç ve Sıradakine Geç ('+sira+')</button>'
      + '<div style="display:flex;gap:6px">'
      + '<button class="btn btn-block" style="background:#f1f5f9;color:#475569;font-size:.78rem" onclick="asistanSonraki(false)">Atla (Gönderme) ➔</button>'
      + '<button class="btn btn-danger btn-block" style="font-size:.78rem" onclick="closeModal()">İşlemi İptal Et</button>'
      + '</div>';
  }

  openModal(body);
}

  if(!isAdmin || sakinDaireKodu) return;
  const mesajEl = document.getElementById('asistanMesaj');
  const mesaj = mesajEl ? mesajEl.value : '';

  if(!isAdmin || sakinDaireKodu) return;
  const e = db.eskiOturan.find(x => x.id===id); if(!e) return;
  const tutar = Number(document.getElementById('e_odTutar').value)||0;
  if(tutar <= 0){ alert('Geçerli bir tutar girin'); return; }
  const gercekTutar = Math.min(tutar, Number(e.kalan)||0);
  e.kalan = Math.max(0, (Number(e.kalan)||0) - gercekTutar);
  e.odenen = (Number(e.odenen)||0) + gercekTutar;
  bankaBakiEkle(gercekTutar);
  saveDB(); closeModal(); render(); alert('Tahsilat kaydedildi.');
}
function eskiSil(id){
  if(!isAdmin || sakinDaireKodu) return;
  if(!confirm('Kayıt silinsin mi?')) return;
  db.eskiOturan = db.eskiOturan.filter(x => x.id!==id);
  saveDB(); render();
}

function topluYukleForm(){
  if(!isAdmin || sakinDaireKodu) return;
  const body = '<h2>📥 Toplu Banka Ekstresi Yükle</h2>'
    + '<div class="uyari">Banka hareketlerini içeren Excel (.xlsx) dosyasını seçin. Daire No, Tarih, İsim, Tutar sütunları otomatik eşleşir.</div>'
    + '<div class="fg"><label>Dosya Seç (.xlsx veya .xls)</label><input type="file" class="fc" id="topluFile" accept=".xlsx,.xls"></div>'
    + '<button class="btn btn-primary btn-block" onclick="topluDosyaOku()">📤 Dosyayı Yükle ve İşle</button>';
  openModal(body);
}

async function topluDosyaOku(){
  if(!isAdmin || sakinDaireKodu) return;
  const fileInput = document.getElementById('topluFile');
  if(!fileInput.files || !fileInput.files[0]){ alert('Lütfen bir dosya seçin'); return; }
  const file = fileInput.files[0];
  const ext = file.name.split('.').pop().toLowerCase();
  
  if(ext === 'xlsx' || ext === 'xls'){
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet);
        let say = 0;
        let toplamTutar = 0;
        rows.forEach(r => {
          const dKod = (r['Daire'] || r['Daire No'] || r['DAIRE'] || '').toString().trim().toUpperCase();
          const tutar = Number(r['Tutar'] || r['Miktar'] || 0);
          if(getApt(dKod) && tutar > 0){
            db.bankaHareketleri.push({
              id: 'bh_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
              daire: dKod,
              tarih: bugun().split('-').reverse().join('.'),
              isim: r['İsim'] || r['Gönderen'] || 'Ekstre Verisi',
              tutar: tutar,
              aciklama: r['Açıklama'] || 'Toplu Yükleme'
            });
            toplamTutar += tutar;
            say++;
          }
        });
        if(toplamTutar > 0) bankaBakiEkle(toplamTutar);
        saveDB(); closeModal(); render(); alert(say + ' adet banka hareketi başarıyla eklendi. Toplam: '+fmtMoney(toplamTutar));
      }catch(err){ alert('Dosya işlenirken hata oluştu.'); }
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('Lütfen geçerli bir Excel (.xlsx / .xls) dosyası seçin.');
  }
}

/* ============ MODAL KONTROLLERİ ============ */
function openModal(html, showClose){
  if(showClose === undefined) showClose = true;
  document.getElementById('modBody').innerHTML = html;
  const cBtn = document.getElementById('modCloseBtn');
  if(cBtn) cBtn.style.display = showClose ? 'block' : 'none';
  document.getElementById('mov').classList.add('open');
}
function closeModal(){
  document.getElementById('mov').classList.remove('open');
}

document.getElementById('mov').addEventListener('click', function(e){
  const cBtn = document.getElementById('modCloseBtn');
  if(cBtn && cBtn.style.display === 'none') return;
  if(e.target.id === 'mov') closeModal();
});

/* =========================================================
   UYGULAMA BAŞLATMA
   ========================================================= */
function uygulamaBaslat(){
  try{
    checkAutoFill();
    renderNav();
    render();
    initFirebase().catch(function(e){
      console.warn('Firebase başlatılamadı, yerel modda çalışılıyor:', e);
    });
  }catch(e){
    console.error('Uygulama başlatma hatası:', e);
    document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626"><h2>Bir hata oluştu</h2><p>'+e.message+'</p><button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;border-radius:8px;border:none;background:#1e3f6e;color:#fff;cursor:pointer">Sayfayı Yenile</button></div>';
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', uygulamaBaslat);
} else {
  uygulamaBaslat();
}
</script>
